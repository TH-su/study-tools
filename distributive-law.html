<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>分配法則ラボ</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1d2340; --sub:#555d7d; --line:#d9deec;
  --accent:#3b5bdb; --accent-ink:#ffffff; --accent-soft:#e3e9ff;
  --blue:#2f6fde; --orange:#d9680a; --ok:#1a8a4a; --ng:#c92a5e; --gold:#e09b00;
  --blue-soft:#dbe6ff; --orange-soft:#ffe3cc; --green-soft:#d4f3e1; --gray-soft:#eceef5; --cut:#c4c9d8; --shadow:0 2px 10px rgba(30,40,90,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141f; --card:#1b2030; --ink:#e8ebf7; --sub:#a9b0cb; --line:#2f3653;
    --accent:#7d95ff; --accent-ink:#0d1020; --accent-soft:#26305a;
    --blue:#77a2ff; --orange:#ffa452; --ok:#52d38d; --ng:#ff7fa6; --gold:#ffcb45;
    --blue-soft:#22325c; --orange-soft:#4a3119; --green-soft:#1c3d2b; --gray-soft:#2a3045; --cut:#3b4260; --shadow:0 2px 10px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#11141f; --card:#1b2030; --ink:#e8ebf7; --sub:#a9b0cb; --line:#2f3653;
  --accent:#7d95ff; --accent-ink:#0d1020; --accent-soft:#26305a;
  --blue:#77a2ff; --orange:#ffa452; --ok:#52d38d; --ng:#ff7fa6; --gold:#ffcb45;
  --blue-soft:#22325c; --orange-soft:#4a3119; --green-soft:#1c3d2b; --gray-soft:#2a3045; --cut:#3b4260; --shadow:0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;line-height:1.6;font-size:1rem}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.topbar h1{font-size:1.35rem;margin:0}
.back{color:var(--accent);text-decoration:none;font-size:.9rem;min-height:44px;display:inline-flex;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{margin:0 0 6px;font-size:1.1rem}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lv{display:flex;align-items:baseline;gap:8px}
.lv b{font-size:1.6rem}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font-size:.85rem;font-weight:700}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.muted{color:var(--sub);font-size:.9rem}
.streak{font-size:1.1rem;font-weight:700}
.btn{min-height:48px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{width:100%;font-size:1.15rem;min-height:60px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.blank:focus-visible,.opt:focus-visible,.key:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2 .card{margin-bottom:0}
.worlds{display:grid;gap:12px}
.world{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center}
.wnum{width:48px;height:48px;border-radius:12px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem}
.world h3{margin:0;font-size:1.05rem}
.world .ex{font-variant-numeric:tabular-nums;color:var(--sub);font-size:.9rem}
.badge{font-size:.8rem;font-weight:700;padding:1px 8px;border-radius:99px;border:1px solid var(--line);margin-left:6px;white-space:nowrap}
.badge.m1{background:var(--line)} .badge.m2{background:var(--blue-soft)} .badge.m3{background:var(--orange-soft)} .badge.m4{background:var(--gold);color:#1d2340}
.locked{opacity:.6}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:.8rem}
.cal .h{color:var(--sub);font-weight:700}
.cal .d{aspect-ratio:1;border-radius:8px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1.1}
.cal .d.done{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:800}
.cal .d.frz{background:var(--blue-soft)}
.cal .d.today{outline:2px solid var(--gold)}
.cal .d.fut{opacity:.35}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px}
.tcard{border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--card);text-align:center}
.tcard .e{font-size:2rem;line-height:1.2}
.tcard b{display:block;font-size:.95rem}
.tcard.on{border-color:var(--gold)}
.tcard.off .e{filter:grayscale(1);opacity:.35}
.newcard{font-weight:800;color:var(--accent)}
/* play */
.playhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.prog{display:flex;gap:4px;flex-wrap:wrap}
.prog i{width:14px;height:14px;border-radius:4px;background:var(--line);display:block}
.prog i.d{background:var(--accent)} .prog i.c{outline:2px solid var(--gold)} .prog i.boss{border-radius:50%}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.ta{font-size:1.2rem;color:var(--ng)}
.qtitle{font-size:1.1rem;font-weight:700;margin:0 0 6px}
.diagram{display:flex;justify-content:center;margin:6px 0 10px;overflow-x:auto}
.diagram svg{max-width:100%;height:auto}
.expr{font-size:1.35rem;font-variant-numeric:tabular-nums;font-weight:700;display:grid;gap:6px;margin:6px 0 10px}
.expr .ln{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.expr .ln > span{min-width:0}
.blank{min-width:64px;min-height:48px;padding:4px 10px;border-radius:10px;border:2px dashed var(--sub);background:var(--bg);font-size:1.3rem;font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
.blank.act{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.blank.ok{border-style:solid;border-color:var(--ok);color:var(--ok);cursor:default}
.blank.ng{border-style:solid;border-color:var(--ng);color:var(--ng)}
.choice p{margin:4px 0 8px;font-weight:700}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.opt{min-height:56px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:1.25rem;font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
.opt:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.fb{min-height:1.6em;font-weight:700;margin:4px 0}
.fb.ng{color:var(--ng)} .fb.ok{color:var(--ok)}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.key{min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:1.35rem;font-weight:800;cursor:pointer;box-shadow:var(--shadow)}
.key.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:1.05rem;white-space:nowrap}
.stars{font-size:2rem;letter-spacing:4px}
.stars .on{color:var(--gold)} .stars .off{color:var(--line)}
.starlist{list-style:none;padding:0;margin:6px 0;display:grid;gap:2px}
.starlist li{font-size:.95rem}
.done-panel{border:2px solid var(--ok)}
.boss-panel{border:2px solid var(--gold)}
.explain{margin:6px 0 10px}
.res-big{font-size:1.5rem;font-weight:800;margin:0 0 6px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;max-width:90vw;z-index:10;display:none}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion: reduce){ .pop,.shake{animation:none} }
@media (max-width:560px){ .grid2{grid-template-columns:1fr} }
@media (max-width:420px){ .expr{font-size:1.15rem} .blank{min-width:56px;font-size:1.15rem} .world{grid-template-columns:40px 1fr} .world .act-col{grid-column:1 / -1} .wnum{width:40px;height:40px} }
/* svg */
.sv-blue{fill:var(--blue-soft);stroke:var(--blue);stroke-width:2}
.sv-orange{fill:var(--orange-soft);stroke:var(--orange);stroke-width:2}
.sv-green{fill:var(--green-soft);stroke:var(--ok);stroke-width:2}
.sv-gray{fill:var(--gray-soft);stroke:var(--sub);stroke-width:2}
.sv-cut{fill:url(#dl-hatch);stroke:var(--ng);stroke-width:2;stroke-dasharray:5 4}
.sv-dotb{fill:var(--blue)} .sv-doto{fill:var(--orange)}
.sv-t{fill:var(--ink);font-size:15px;font-weight:700;font-family:inherit}
.sv-tb{fill:var(--blue);font-size:15px;font-weight:800}
.sv-to{fill:var(--orange);font-size:15px;font-weight:800}
.sv-tg{fill:var(--ok);font-size:15px;font-weight:800}
.sv-ts{fill:var(--sub);font-size:15px;font-weight:800}
.sv-tn{fill:var(--ng);font-size:15px;font-weight:800}
.sv-big{fill:var(--ink);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.sv-bigb{fill:var(--blue);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.sv-hatch{stroke:var(--ng);stroke-width:1.5}
.sv-rule{stroke:var(--ink);stroke-width:2}
/* make（問題を作る） */
.mkrow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.field{display:grid;gap:4px}
.field label{font-weight:700;font-size:.95rem}
.inp{min-height:48px;width:7.5em;padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.inp:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mylist{list-style:none;padding:0;margin:8px 0;display:grid;gap:8px}
.vx{font-style:italic;font-family:'Times New Roman',Times,serif;font-size:1.15em;padding:0 .04em}
.mylist li{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-variant-numeric:tabular-nums;font-weight:700}
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="off"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ===== 定数 ===== */
const KEY='dl_state_v1', BAK='dl_state_v1_bak', SES='dl_session_v1', LAST='dl_last_result_v1', VIEW='dlcfg_view';
const VIEWS=['home','play','result','cards','make'];
const WORLDS=[
  {id:1,name:'見える分配',sub:'点の図を2つに分けてかける',ex:'4×(3＋5)',target:30},
  {id:2,name:'かっこを開く',sub:'4つの形を使いこなす',ex:'6×(20−3)',target:35},
  {id:3,name:'工夫・たし算',sub:'キリのよい数＋あまりに分ける',ex:'102×7',target:30},
  {id:4,name:'工夫・ひき算',sub:'キリのよい数から少しひく',ex:'98×7',target:35},
  {id:5,name:'まとめる',sub:'同じ数でくくって一発で',ex:'37×6＋37×4',target:35},
  {id:6,name:'4つの部屋',sub:'2けた×2けたを面積図で・筆算の中の分配法則',ex:'23×47',target:45},
  {id:7,name:'達人の技',sub:'99・25・1001・小数・3つまとめ',ex:'25×44',target:40},
  {id:8,name:'文字の式',sub:'x を使って分配法則（中学の先取り）',ex:'3×(x＋4)',target:40},
];
const DAILY_BONUS=50, MY_MAX=20, MY_PLAY=5;
const UNLOCK=30, GOOD=60, MASTER=100, GOOD_DAYS=2, MASTER_DAYS=3; // とくい・マスターは別の日にも練習した時だけ
const TITLES=['たまご','ひよこ','見習い','けいさん職人','くふう名人','ぶんぱい達人','分配博士','大博士','伝説の数学者'];
const MISSION_N=10, PRACTICE_N=5, MISSION_BONUS=30, TA_SEC=60, REVIEW_MAX=3, REVIEW_STEPS=[1,3,7];
/* むずかしさ（1〜5）。3 が今までと同じ。倍率は整数の10分の1（小数の誤差で切り上げがずれないように） */
const DIFF='dlcfg_level', DIFFS=[1,2,3,4,5], DIFF_NAMES={1:'やさしい',2:'ふつうの下',3:'ふつう',4:'むずかしい',5:'超むずかしい'};
const T_MUL={1:15,2:12,3:10,4:10,5:9}, P_MUL={1:6,2:8,3:10,4:13,5:16}, G_MUL={1:50,2:75,3:100,4:100,5:100}; // 目標時間・点（10分の1）、習熟の伸び（100分の1）
const EASY_CAP=UNLOCK-1; // 段1・2 では習熟は29点まで（段1・2だけで次のワールドを開かない）
const isLv=v=>DIFFS.includes(v);
const SKILL_MIN=3; // 腕前のカード（speed・ta8・perfect・boss・boss5・review）・bossWins・練習日数は むずかしさ3以上だけ
const RANKS=[{max:8,n:'いなずま'},{max:12,n:'ジェット'},{max:18,n:'ロケット'},{max:25,n:'じてんしゃ'},{max:1e9,n:'あるき'}];
const CARDS=[
  {id:'dots',e:'🔵',n:'点の図マスター',d:'ワールド1で★3をとる'},
  {id:'paren4',e:'🧩',n:'4つの形',d:'ワールド2の4つの形をぜんぶ解く'},
  {id:'r100',e:'💯',n:'100にする技',d:'100＋あまり に分けて解く'},
  {id:'r1000',e:'🏔',n:'1000にする技',d:'1000以上＋あまり に分けて解く'},
  {id:'minus',e:'✂️',n:'切り取りの技',d:'キリのよい数−少し で解く'},
  {id:'group',e:'🤝',n:'くくる技',d:'同じ数でまとめて解く'},
  {id:'group100',e:'🎯',n:'100でくくる',d:'まとめると100になる問題を解く'},
  {id:'grid',e:'🏠',n:'4つの部屋',d:'2けた×2けたを4つに分けて解く'},
  {id:'hissan',e:'📝',n:'筆算の秘密',d:'筆算の中に分配法則を見つける'},
  {id:'n99',e:'🎱',n:'99の技',d:'99×2けたを 100−1 で解く'},
  {id:'q25',e:'🪙',n:'25の技',d:'25×4＝100 を使って解く'},
  {id:'dec',e:'🔸',n:'小数でも使える',d:'小数の分配法則を解く'},
  {id:'g3',e:'🧺',n:'3つまとめ',d:'3つのかけ算を1つにまとめる'},
  {id:'n1001',e:'🪞',n:'1001の不思議',d:'1001×数 を 1000＋1 で解く'},
  {id:'boss',e:'👑',n:'ボスたおし',d:'ボス問題を★2以上で解く（むずかしさ3以上）'},
  {id:'boss5',e:'🏆',n:'ボスハンター',d:'ボス問題を5回たおす（むずかしさ3以上）'},
  {id:'speed',e:'⚡',n:'いなずま',d:'1問を10秒以内で解く（むずかしさ3以上）'},
  {id:'perfect',e:'🌟',n:'パーフェクト',d:'ミッション10問すべて★3（むずかしさ3以上）'},
  {id:'review',e:'🔁',n:'ふくしゅう名人',d:'ふくしゅう問題を★3で解く（むずかしさ3以上）'},
  {id:'ta8',e:'⏱',n:'60秒で8問',d:'タイムアタックで8問以上解く（むずかしさ3以上）'},
  {id:'st3',e:'🔥',n:'3日れんぞく',d:'ミッションを3日つづける'},
  {id:'st7',e:'🔥',n:'1週間れんぞく',d:'ミッションを7日つづける'},
  {id:'st30',e:'🌋',n:'30日れんぞく',d:'ミッションを30日つづける'},
  {id:'master',e:'🎓',n:'はじめてのマスター',d:'どれかのワールドをマスターにする'},
  {id:'lv10',e:'🚀',n:'レベル10',d:'レベル10になる'},
  {id:'xexp',e:'🔤',n:'文字の式デビュー',d:'ワールド8で x のかっこを開く'},
  {id:'xfactor',e:'🧲',n:'文字でくくる',d:'ワールド8で x の式をくくる'},
  {id:'xsame',e:'🟰',n:'いつでも同じ',d:'ワールド8で2つの式が同じになるのを確かめる'},
  {id:'xlike',e:'🧮',n:'x をまとめる',d:'ワールド8で ○x ＋ △x をまとめる'},
  {id:'daily',e:'🧠',n:'きょうの難問',d:'きょうの難問をはじめて解く'},
  {id:'daily7',e:'🗓️',n:'難問7回',d:'きょうの難問を7日解く'},
  {id:'maker',e:'✏️',n:'問題を作った',d:'マイ問題をはじめて作る'},
  {id:'maker5',e:'🏗️',n:'問題作家',d:'マイ問題を5問ためる'},
];
const CARD_IDS=CARDS.map(c=>c.id);

/* ===== 保存（失敗しても既存データを残す） ===== */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
const num=v=>typeof v==='number'&&isFinite(v);
const isDate=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v);
/* 前の版のタブが読んでも段3の記録が残るように、段3の値を前の形（best・recent）でも持つ。読む時は段ごとの方を優先 */
function syncTaMirror(ta){ta.best=ta[3].best;ta.recent=ta[3].recent.slice();return ta;}
function defaultState(){return {v:1,xp:0,worlds:{},days:{},total:{solved:0,stars:0},cards:{},review:[],ta:syncTaMirror(Object.fromEntries(DIFFS.map(L=>[L,{best:0,recent:[]}]))),bossWins:0,forms:[],daily:{last:'',count:0,pick:null},myProblems:[]}}
/* マイ問題1件の検査（N×m、N＝x op y） */
const isInt=(v,a,b)=>num(v)&&Math.floor(v)===v&&v>=a&&v<=b;
const validMy=q=>!!q&&typeof q==='object'&&isInt(q.N,2,9999)&&isInt(q.m,2,9999)&&isInt(q.x,1,9999)&&isInt(q.y,1,9999)&&(q.op==='+'||q.op==='−')&&(q.op==='+'?q.x+q.y:q.x-q.y)===q.N;
function normalize(s){
  const o=defaultState();
  o.xp=num(s.xp)&&s.xp>=0?Math.floor(s.xp):0;
  if(s.total&&typeof s.total==='object'){o.total.solved=num(s.total.solved)?s.total.solved:0;o.total.stars=num(s.total.stars)?s.total.stars:0;}
  for(const w of WORLDS){const x=s.worlds&&s.worlds[w.id];if(x&&typeof x==='object'){o.worlds[w.id]={pts:num(x.pts)?Math.max(0,Math.min(MASTER,x.pts)):0,n:num(x.n)?x.n:0,three:num(x.three)?x.three:0,days:num(x.days)?x.days:0,last:isDate(x.last)?x.last:''};}}
  if(s.days&&typeof s.days==='object'){for(const k of Object.keys(s.days)){if(isDate(k)){const d=s.days[k]||{};o.days[k]={mission:d.mission===true,solved:num(d.solved)?d.solved:0,stars:num(d.stars)?d.stars:0};}}}
  if(s.cards&&typeof s.cards==='object'){for(const id of CARD_IDS){if(isDate(s.cards[id]))o.cards[id]=s.cards[id];}}
  if(Array.isArray(s.review))o.review=s.review.filter(r=>r&&num(r.w)&&r.w>=1&&r.w<=WORLDS.length&&num(r.k)&&isDate(r.due)&&num(r.step)).slice(-30).map(r=>({w:r.w,k:r.k,due:r.due,step:r.step,lv:isLv(r.lv)?r.lv:3})); // lv: まちがえた時のむずかしさ（前の版の項目は3）

        hints:[`${a} を x と ${b} の両方にかける。${a}×x は、x の前に何を書く？`,`${a} を x と ${b} の両方にかける。${a}×${b} は？`]};}
    if(t==='xfactor')return {lines:[[`${a}x ＋ ${ab}`],['＝ ',B(0),'×(x ＋ ',B(1),')']],ans:[a,b],
      hints:['x の前の数でくくる。x の前の数は？',`${a}×□＝${ab} の □ は？`]};
    if(t==='xsame'){const v=p.v,r=a*(v+b);
      return {lines:[[`${a}×(x＋${b})`,` ＝ ${a}×(${v}＋${b}) ＝ ${a}×`,B(0),' ＝ ',B(1)],[`${a}x＋${ab}`,` ＝ ${a}×${v}＋${ab} ＝ `,B(2),`＋${ab} ＝ `,B(3)]],ans:[v+b,r,a*v,r],
        hints:[`${v}＋${b} は？`,`${a}×${v+b} は？`,`${a}×${v} は？`,`${a*v}＋${ab} は？`]};}
    const op=OPC(p.op),r=p.op==='+'?a+b:a-b;
    return {lines:[[`${a}x ${op} ${b}x`],['＝ (',B(0),' '+op+' ',B(1),')x'],['＝ ',B(2),'x']],ans:[a,b,r],
      hints:['1つめの x の前の数は？','2つめの x の前の数は？',`${a} ${op} ${b} は？`]};
  }
  // group3
  const a=p.a;
  return {lines:[[`${a}×${p.b} ＋ ${a}×${p.c} ＋ ${a}×${p.d}`],['＝ '+a+'×(',B(0),' ＋ ',B(1),' ＋ ',B(2),')'],['＝ '+a+'×',B(3)],['＝ ',B(4)]],
    ans:[p.b,p.c,p.d,p.T,a*p.T],hints:['1つめのかけ算の、もう1つの数は？','2つめのかけ算の、もう1つの数は？','3つめのかけ算の、もう1つの数は？',`${p.b}＋${p.c}＋${p.d} は？`,`${a}×${p.T} は？`]};
}
function headOf(p){if(typ(p)==='split')return p.left?`${p.N}×${p.m}`:`${p.m}×${p.N}`;return build(p,0).lines[0][0];}
function qTitle(p){
  const t=typ(p),h=headOf(p);let s;
  if(t==='dots')s=p.area===true?`${h} を、長方形を2つに分けて計算しよう`:'点の数を、2つに分けて数えよう';
  else if(t==='paren')s='かっこを開いて計算しよう';
  else if(t==='split')s=`${h} を工夫して計算しよう`;
  else if(t==='group'||t==='group3')s=`${h} をまとめて計算しよう`;
  else if(t==='grid')s=`${h} を4つの部屋に分けて計算しよう`;
  else if(t==='hissan')s='筆算の中の分配法則をさがそう';
  else if(t==='xexp')s=`${h} のかっこを開こう（x はどんな数でもよい）`;
  else if(t==='xfactor')s=`${h} を、x の前の数でくくろう`;
  else if(t==='xsame')s=`x＝${p.v} のとき、2つの式を計算しよう`;
  else if(t==='xlike')s=`${h} を、x についてまとめよう`;
  else s=`小数でも分配法則！ ${h} を計算しよう`;
  return (p.daily?'🧠 きょうの難問 ':'')+(p.my?'✏️ マイ問題　':'')+(p.boss?'👑 ボス問題！ ':'')+(p.rev?'🔁 ふくしゅう　':'')+s;
}
function choiceOf(p){
  const t=typ(p);
  if(t==='split')return {prompt:`${p.N} をどう分ける？`,labels:p.opts.map(o=>`${o.x}${OPC(o.op)}${o.y}`)};
  if(t==='group'||t==='group3')return {prompt:'どのかけ算にもある数は？（その数でまとめる）',labels:p.opts.map(String)};
  if(t==='hissan')return {prompt:`${p.A}×${p.m} のくわしい筆算。2段めは、どのかけ算の答え？`,labels:p.opts.slice()};
  return null;
}
function explain(p,ch,best){
  const t=typ(p);
  if(t==='dots')return `${p.a}×(${p.b}＋${p.c}) は「${p.a}×${p.b}」と「${p.a}×${p.c}」を合わせたもの。`+(p.area===true?'長方形を2つに分けても、面積は変わらないね。':'点の図を2つに分けても、点の数は変わらないね。');
  if(t==='paren'){const plus=p.form%2===0;return plus?`かっこの中の2つの数に、それぞれ ${p.a} をかけてたす。長方形を2つに切っても面積は同じ。`:`大きい長方形（×${p.b}）から、切り取った帯（×${p.c}）の分をひく。ひき算でも分配法則が使える。`;}
  if(t==='split'&&p.my){ // マイ問題: best は自分の分け方の位置なので「いちばん楽」とは言わない
    const o=p.opts[p.best],own=`${o.x}${OPC(o.op)}${o.y}`;
    if(ch!==p.best){const c=p.opts[ch];return `${c.x}${OPC(c.op)}${c.y} でも計算できた！ 自分で作った分け方は ${own} だったね。`;}
    return `自分で作った分け方（${own}）で計算できた！ 分け方を変えると、もっと楽になるかも。`;
  }
  if(t==='split'){
    const o=p.opts[p.best], mul=v=>p.left?`${v}×${p.m}`:`${p.m}×${v}`;
    let why=o.op==='+'?`${p.N} を ${o.x}＋${o.y} に分けると、${mul(o.x)} はすぐわかる。あとは ${mul(o.y)} をたすだけ。`:`${p.N} は ${o.x} より ${o.y} 小さい。${mul(o.x)} から ${mul(o.y)} をひけば一発。`;
    if(p.w===7&&p.k===1)why+=' 25×4＝100 だから、25×40 や 25×80 もすぐわかる。';
    if(p.w===7&&p.k===4)why+=` ${p.m}×1000 と ${p.m} をたすので、${p.m} が2回ならぶ！`;
    if(best)return 'いちばん楽な分け方！ '+why;
    const c=p.opts[ch];return `${c.x}${OPC(c.op)}${c.y} でも計算できた！ でも、${why}`;
  }
  if(t==='group')return `どちらにも ×${p.a} があるので ${p.a}×(${p.b}${OPC(p.op)}${p.c}) とまとめられる。${p.b}${OPC(p.op)}${p.c}＝${p.T} だから、${p.a}×${p.T} で一発！`;
  if(t==='group3')return `3つとも ×${p.a} があるので ${p.a}×(${p.b}＋${p.c}＋${p.d}) にまとめられる。3つでも分配法則は使える！`;
  if(t==='grid')return `${p.a1*10+p.a2}×${p.b1*10+p.b2} は、たてとよこを十の位と一の位に分けた4つの部屋の面積をたしたもの。2回分配しているんだね。`;
  if(t==='xexp')return p.op==='+'?`かっこの中の x と ${p.b} の両方に ${p.a} をかけて、${p.a}x ＋ ${p.a*p.b}。x がどんな数でも、長方形を2つに切って面積をたすのと同じ。`
    :`x から ${p.b} をひいたものに ${p.a} をかける＝ ${p.a}x から ${p.a*p.b} をひく。x がどんな数でも、切り取りの図と同じ。`;
  if(t==='xfactor')return `${p.a}x＝${p.a}×x、${p.a*p.b}＝${p.a}×${p.b}。どちらにも ×${p.a} があるので ${p.a}×(x＋${p.b}) とくくれる。分配法則を逆に使った！`;
  if(t==='xsame')return `x＝${p.v} だと、どちらも ${p.a*(p.v+p.b)}。x をほかの数にしても、2つの式はいつも同じ答えになる。どんな x でも同じ＝分配法則！`;
  if(t==='xlike')return `${p.a}x ${OPC(p.op)} ${p.b}x は「x が ${p.a}こ」${p.op==='+'?'と':'から'}「x が ${p.b}こ」${p.op==='+'?'を合わせる':'をとる'}。だから (${p.a}${OPC(p.op)}${p.b})x＝${p.op==='+'?p.a+p.b:p.a-p.b}x。37×6＋37×4 をまとめたのと同じ技だね。`;
  if(t==='hissan')return `くわしい筆算の1段めは ${p.u}×${p.m}、2段めは ${p.t}×${p.m}。筆算は ${p.A} を ${p.t}＋${p.u} に分けて計算してたしている＝分配法則そのもの！`;
  return `${fmt(p.b*10+p.c10)} を ${p.b}＋${fmt(p.c10)} に分けた。小数でも分配法則はそのまま使える（5年生で習う内容の先取り）。`;
}

/* ===== 図（点の図・面積図・筆算） ===== */
const HATCH='<defs><pattern id="dl-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" class="sv-hatch"/></pattern></defs>';
const PCLS=['sv-blue','sv-orange','sv-green','sv-gray'], TCLS=['sv-tb','sv-to','sv-tg','sv-ts'];
function dotsSVG(a,b,c,solved){
  const s=26,gap=14,ox=34,oy=30;const W=ox+(b+c)*s+gap+10,H=oy+a*s+(solved?30:8);
  let g='';
  for(let r=0;r<a;r++)for(let k=0;k<b+c;k++){const x=ox+k*s+(k>=b?gap:0)+s/2,y=oy+r*s+s/2;g+=`<circle cx="${x}" cy="${y}" r="9" class="${k<b?'sv-dotb':'sv-doto'}"/>`;}
  g+=`<text x="${ox+b*s/2}" y="20" text-anchor="middle" class="sv-tb">${b}列</text>`;
  g+=`<text x="${ox+b*s+gap+c*s/2}" y="20" text-anchor="middle" class="sv-to">${c}列</text>`;
  g+=`<text x="14" y="${oy+a*s/2+5}" text-anchor="middle" class="sv-t">${a}</text>`;
  g+=`<line x1="${ox+b*s+gap/2}" y1="${oy-4}" x2="${ox+b*s+gap/2}" y2="${oy+a*s+4}" stroke-dasharray="4 4" style="stroke:var(--sub)"/>`;
  if(solved){g+=`<text x="${ox+b*s/2}" y="${oy+a*s+22}" text-anchor="middle" class="sv-tb">${a*b}</text><text x="${ox+b*s+gap+c*s/2}" y="${oy+a*s+22}" text-anchor="middle" class="sv-to">${a*c}</text>`;}
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="点が${a}行。左に青い点が${b}列、右にオレンジの点が${c}列">${g}</svg>`;
}
/* 図の文字: x は斜体（tspan）。tW は文字の幅の見積り（15px太字で数字・x は d（既定10、部分に収まるかの判定は9）、点4、その他15） */
const svx=s=>String(s).replace(/(^|[^A-Za-z])x(?![A-Za-z])/g,'$1<tspan class="vx">x</tspan>');
const tW=(s,d=10)=>[...String(s)].reduce((a,c)=>a+(/[0-9x]/.test(c)?d:c==='.'?4:15),0);
const padL=h=>tW(h)>36?tW(h)+12:40; // 高さのラベルが4けた以上の時だけ左の余白を広げる（3けたまでは今までどおり 40）
/* 幅 w に収まれば 0、小さくすれば収まればその文字の大きさ、それでも無理なら -1 */
function fitFs(t,w){const e=tW(t,9);if(e<=w-6)return 0;const fs=Math.floor(15*(w-6)/e);return fs>=11?fs:-1;}
const fsAttr=fs=>fs>0?` style="font-size:${fs}px"`:'';
/* たて hLab、よこを parts（v:比の値, lab:上の文字, area:答え）に分けた長方形 */
function areaN(hLab,parts,solved){
  const ox=padL(hLab),oy=28,TW=280,RH=96;let below=0;
  let ws=parts.map(q=>Math.max(1e-9,q.v));const sum=ws.reduce((a,b)=>a+b,0);ws=ws.map(v=>Math.max(48,v/sum*TW));const k=TW/ws.reduce((a,b)=>a+b,0);ws=ws.map(v=>v*k);
  let g='',x=ox;
  parts.forEach((q,i)=>{const fl=fitFs(q.lab,ws[i]);
    g+=`<rect x="${x}" y="${oy}" width="${ws[i]}" height="${RH}" class="${PCLS[i]}" rx="4"/><text x="${x+ws[i]/2}" y="20" text-anchor="middle" class="${TCLS[i]}"${fl<0?' style="font-size:10px"':fsAttr(fl)}>${svx(q.lab)}</text>`;
    if(solved){const fa=fitFs(q.area,ws[i]);
      if(fa<0){below=1;const last=i===parts.length-1; // 部分の中に収まらない面積は下に出す
        g+=`<text x="${last?x+ws[i]:x+ws[i]/2}" y="${oy+RH+20}" text-anchor="${last?'end':'middle'}" class="${TCLS[i]}">${svx(q.area)}</text>`;}
      else g+=`<text x="${x+ws[i]/2}" y="${oy+RH/2+5}" text-anchor="middle" class="${TCLS[i]}"${fsAttr(fa)}>${svx(q.area)}</text>`;}
    x+=ws[i];});
  g+=`<text x="${(ox-4)/2}" y="${oy+RH/2+5}" text-anchor="middle" class="sv-t">${svx(hLab)}</text>`;
  const W=ox+TW+10,H=oy+RH+10+(below?22:0);
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="たて${hLab}の長方形を、よこ${parts.map(q=>q.lab).join('と')}に分けた図">${g}</svg>`;
}
function cutSVG(h,x,y,solved){
  const ox=padL(h),oy=28,TW=280,RH=96;let g=HATCH;
  const wy=Math.min(120,Math.max(44,TW*y/x));
  g+=`<rect x="${ox}" y="${oy}" width="${TW}" height="${RH}" class="sv-blue" rx="4"/><rect x="${ox+TW-wy}" y="${oy}" width="${wy}" height="${RH}" class="sv-cut"/>`;
  g+=`<text x="${ox+TW/2}" y="20" text-anchor="middle" class="sv-tb">${x}</text><text x="${ox+TW}" y="${oy+RH+20}" text-anchor="end" class="sv-tn">−${y}（切り取る）</text>`;
  if(solved)g+=`<text x="${ox+(TW-wy)/2}" y="${oy+RH/2+5}" text-anchor="middle" class="sv-tb"${fsAttr((f=>f<0?10:f)(fitFs(`${h*x}−${h*y}`,TW-wy)))}>${h*x}−${h*y}</text>`;
  g+=`<text x="${(ox-4)/2}" y="${oy+RH/2+5}" text-anchor="middle" class="sv-t">${h}</text>`;
  const W=ox+TW+10,H=oy+RH+30;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="たて${h}、よこ${x}の長方形から、よこ${y}の帯を切り取った図">${g}</svg>`;
}
/* 文字ラベル版の切り取りの図（よこ wl から yl を切り取る。txt は残りの面積） */
function cutL(h,wl,yl,txt,solved){
  const ox=padL(h),oy=28,TW=280,RH=96,wy=84;let g=HATCH;
  g+=`<rect x="${ox}" y="${oy}" width="${TW}" height="${RH}" class="sv-blue" rx="4"/><rect x="${ox+TW-wy}" y="${oy}" width="${wy}" height="${RH}" class="sv-cut"/>`;
  g+=`<text x="${ox+TW/2}" y="20" text-anchor="middle" class="sv-tb">${svx(wl)}</text><text x="${ox+TW}" y="${oy+RH+20}" text-anchor="end" class="sv-tn">−${svx(yl)}（切り取る）</text>`;
  if(solved)g+=`<text x="${ox+(TW-wy)/2}" y="${oy+RH/2+5}" text-anchor="middle" class="sv-tb">${svx(txt)}</text>`;
  g+=`<text x="${(ox-4)/2}" y="${oy+RH/2+5}" text-anchor="middle" class="sv-t">${svx(h)}</text>`;
  const W=ox+TW+10,H=oy+RH+30;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="たて${h}、よこ${wl}の長方形から、よこ${yl}の帯を切り取った図">${g}</svg>`;
}
/* ワールド8の図: x の幅は固定で広め（比 2:1） */
function xDiagram(p,solved){
  const t=typ(p),a=p.a,b=p.b;
  if(t==='xlike')return p.op==='−'?cutL('x',a,b,`${a}x−${b}x`,solved):areaN('x',[{v:a,lab:a,area:`${a}x`},{v:b,lab:b,area:`${b}x`}],solved);
  if(t==='xexp'&&p.op==='−')return cutL(a,'x',b,`${a}x−${a*b}`,solved);
  return areaN(a,[{v:2,lab:'x',area:`${a}x`},{v:1,lab:b,area:a*b}],solved);
}
function rect2(h,x,y,minus,solved){return minus?cutSVG(h,x,y,solved):areaN(h,[{v:x,lab:x,area:h*x},{v:y,lab:y,area:h*y}],solved);}
function gridSVG(p,solved){
  const x1=p.a1*10,x2=p.a2,y1=p.b1*10,y2=p.b2,ox=44,oy=28,TW=270,TH=170;
  const wa=Math.max(60,Math.min(TW-60,TW*x1/(x1+x2))),wb=TW-wa,ha=Math.max(56,Math.min(TH-56,TH*y1/(y1+y2))),hb=TH-ha;
  const cells=[[ox,oy,wa,ha,x1*y1],[ox,oy+ha,wa,hb,x1*y2],[ox+wa,oy,wb,ha,x2*y1],[ox+wa,oy+ha,wb,hb,x2*y2]];
  let g='';cells.forEach((c,i)=>{g+=`<rect x="${c[0]}" y="${c[1]}" width="${c[2]}" height="${c[3]}" class="${PCLS[i]}"/>`;if(solved)g+=`<text x="${c[0]+c[2]/2}" y="${c[1]+c[3]/2+5}" text-anchor="middle" class="${TCLS[i]}">${c[4]}</text>`;});
  g+=`<text x="${ox+wa/2}" y="20" text-anchor="middle" class="sv-t">${x1}</text><text x="${ox+wa+wb/2}" y="20" text-anchor="middle" class="sv-t">${x2}</text>`;
  g+=`<text x="20" y="${oy+ha/2+5}" text-anchor="middle" class="sv-t">${y1}</text><text x="20" y="${oy+ha+hb/2+5}" text-anchor="middle" class="sv-t">${y2}</text>`;
  const W=ox+TW+10,H=oy+TH+10;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="よこ${x1}と${x2}、たて${y1}と${y2}に分けた4つの部屋の面積図">${g}</svg>`;
}
function hissanSVG(p,solved){
  const R=130,LX=150;let g='';const row=(y,txt,cls)=>`<text x="${R}" y="${y}" text-anchor="end" class="${cls}">${txt}</text>`;
  g+=row(30,p.A,'sv-big')+`<text x="40" y="62" class="sv-big">×</text>`+row(62,p.m,'sv-big');
  g+=`<line x1="34" y1="72" x2="${R+4}" y2="72" class="sv-rule"/>`;
  g+=row(100,solved?p.u*p.m:'？','sv-big')+row(132,solved?p.t*p.m:'？','sv-bigb');
  g+=`<line x1="34" y1="142" x2="${R+4}" y2="142" class="sv-rule"/>`;
  g+=row(172,solved?p.A*p.m:'？','sv-big');
  g+=`<text x="${LX}" y="98" class="sv-t">← 1段め${solved?`（${p.u}×${p.m}）`:''}</text><text x="${LX}" y="130" class="sv-tb">← 2段め${solved?`（${p.t}×${p.m}）`:''}</text>`;
  return `<svg viewBox="0 0 330 185" width="330" height="185" role="img" aria-label="${p.A}かける${p.m}のくわしい筆算${solved?`。1段めが${p.u*p.m}、2段めが${p.t*p.m}`:''}">${g}</svg>`;
}
function diagram(p,ch,solved){
  const t=typ(p);
  if(t==='dots')return p.area===true?rect2(p.a,p.b,p.c,false,solved):dotsSVG(p.a,p.b,p.c,solved);
  if(t==='paren')return rect2(p.a,p.b,p.c,p.form%2===1,solved);
  if(t==='grid')return gridSVG(p,solved);
  if(t==='hissan')return hissanSVG(p,solved);
  if(XT.includes(t))return xDiagram(p,solved);
  if(t==='dec')return areaN(fmt(p.a10),[{v:p.b,lab:p.b,area:p.a10*p.b/10},{v:p.c10/10,lab:fmt(p.c10),area:p.a10*p.c10/100}],solved);
  if(ch==null)return '';
  if(t==='split'){const o=p.opts[ch];return rect2(p.m,o.x,o.y,o.op==='−',solved);}
  if(t==='group')return rect2(p.a,p.b,p.c,p.op==='−',solved);
  return areaN(p.a,[p.b,p.c,p.d].map(v=>({v,lab:v,area:p.a*v})),solved);
}

/* ===== セッション ===== */
let view='home', ses=null, cur=null, timerId=null;
const today=()=>dkey(new Date());
const isFree=p=>!!(p.my||(ses&&ses.practice));
/* むずかしさ（UI の状態として保存。既知値だけ受け取り、ほかは3） */
let diff=(v=>['1','2','3','4','5'].includes(v)?Number(v):3)(lsGet(DIFF));
function setDiff(L){if(!isLv(L))return;diff=L;lsSet(DIFF,String(L));render();const b=app.querySelector&&app.querySelector('[data-diff="'+L+'"]');if(b)b.focus();} // 押したボタンにフォーカスを戻す
/* 点・目標時間・習熟に使う段: きょうの難問とマイ問題はむずかしさに関係なく3 */
const lvOf=p=>(p.daily||p.my)?3:(p.rev&&isLv(p.lv))?p.lv:(ses&&isLv(ses.level)?ses.level:3); // ふくしゅうは作った段

const dueReviews=()=>state.review.filter(r=>r.due<=today()&&unlocked(r.w));
function weightedWorld(U){const ws=U.map(id=>MASTER+20-wstat(id).pts);let r=Math.random()*ws.reduce((a,b)=>a+b,0),i=0;while(r>=ws[i]&&i<ws.length-1){r-=ws[i];i++;}return U[i];}
function genTA(L){return gen(pick(WORLDS.filter(x=>x.id<=5&&unlocked(x.id)).map(x=>x.id)),{level:L});}
/* きょうの難問: 日付から作った種で Math.random を一時的に差し替えて作る（例外でも必ず戻す） */
function seedOf(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

function withSeed(seed,fn){const orig=Math.random;Math.random=seeded(seed);try{return fn();}finally{Math.random=orig;}}
/* その日最初に作った時のワールドを state.daily.pick に残し、同じ日はそれを使う（日の途中でワールドが開いても変わらない） */
function dailyProblem(dk){
  const U=WORLDS.filter(x=>unlocked(x.id)).map(x=>x.id);
  const pk=state.daily.pick,keep=pk&&pk.date===dk&&unlocked(pk.w)?pk.w:0;
  const p=withSeed(seedOf('dl-daily-'+dk),()=>{const r=Math.random();const w=keep||U[Math.floor(r*U.length)];return Object.assign(gen(w,{hard:true}),{daily:true});});
  if(!keep){refreshState();const q=state.daily.pick;if(q&&q.date===dk&&unlocked(q.w))return dailyProblem(dk); // 別タブが先に決めていたらそれに合わせる
    state.daily.pick={date:dk,w:p.w};lsSet(KEY,JSON.stringify(state));} // 画面を出すだけの保存なので BAK は回さない（読み込み直後の控えを上書きしない）

const dailyDone=dk=>state.daily.last>=dk;
/* マイ問題 → 既存の split 型の問題（w は 3、my:true。ワールドの習熟は動かさない） */
function altSplits(N,own){
  const key=o=>o.op==='+'?'+'+Math.min(o.x,o.y)+'/'+Math.max(o.x,o.y):'−'+o.x+'/'+o.y;
  const seen=new Set([key(own)]),out=[];
  const c=[];
  if(N>=11&&N%10)c.push({x:N-N%10,y:N%10,op:'+'});
  if(N%10)c.push({x:N+10-N%10,y:10-N%10,op:'−'});
  if(N>=101&&N%100)c.push({x:N-N%100,y:N%100,op:'+'},{x:N+100-N%100,y:100-N%100,op:'−'});
  if(N%2===0)c.push({x:N/2,y:N/2,op:'+'});
  c.push({x:N-1,y:1,op:'+'},{x:N+1,y:1,op:'−'},{x:N+2,y:2,op:'−'},{x:N+3,y:3,op:'−'});
  for(const o of c){if(out.length>=2)break;if(o.x<1||o.y<1||(o.op==='+'?o.x+o.y:o.x-o.y)!==N)continue;const k=key(o);if(seen.has(k))continue;seen.add(k);out.push(o);}
  return out;
}
function myProblem(q){const own={x:q.x,y:q.y,op:q.op};const opts=shuffle([own,...altSplits(q.N,own)]);return {w:3,my:true,N:q.N,m:q.m,left:true,opts,best:opts.indexOf(own)};}
function newSession(mode,w){
  const list=[],L=diff;
  if(mode==='my'){refreshState();for(const q of state.myProblems.slice(-MY_PLAY).reverse())list.push(myProblem(q));
    if(!list.length){toast('まだマイ問題がありません。先に問題を作ってね');return;}}
  else if(mode==='daily'){list.push(dailyProblem(today()));}
  else if(mode==='world'){for(let i=0;i<PRACTICE_N-1;i++)list.push(gen(w,{level:L}));list.push(bossOf(w,L));}
  else if(mode==='ta'){list.push(genTA(L));}
  else{
    for(const r of dueReviews().slice(0,REVIEW_MAX))list.push(Object.assign(gen(r.w,{k:r.k,level:r.lv}),{rev:true,lv:r.lv}));
    const U=WORLDS.filter(x=>unlocked(x.id)).map(x=>x.id);
    while(list.length<MISSION_N)list.push(gen(weightedWorld(U),{level:L}));
  }
  ses={id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),mode,level:L,w:w||0,list,idx:0,results:[],newCards:[],xp0:state.xp,taBest0:state.ta[L].best,pts0:Object.fromEntries(WORLDS.map(x=>[x.id,wstat(x.id).pts])),unl0:WORLDS.filter(x=>unlocked(x.id)).map(x=>x.id),day:today()};
  if(mode==='ta')ses.endAt=Date.now()+TA_SEC*1000;

}
function saveSes(){
  if(!ses)return;

    // 別のタブで同じセッションが先に進んでいる・別のセッションに替わった時は上書きしない
    if(st&&st.id===ses.id&&Array.isArray(st.results)&&st.results.length>ses.results.length)return;
    if(ses.results.length>0&&(!st||st.id!==ses.id))return;}
  if(cur)ses.cur=Object.assign({idx:ses.idx},cur);lsSet(SES,JSON.stringify(ses));
}
function loadSes(){
  try{const s=JSON.parse(lsGet(SES)||'null');
    if(!s||!['mission','world','ta','daily','my'].includes(s.mode)||!Array.isArray(s.list)||!s.list.length||!s.list.every(validP)||!num(s.idx)||s.idx<0||s.idx>=s.list.length||!Array.isArray(s.results))return null;
    if(!num(s.xp0)||!s.pts0||!Array.isArray(s.unl0))return null;
    if(s.mode==='ta'&&!num(s.endAt))return null;
    if(!isDate(s.day))s.day=today();
    if(!Array.isArray(s.newCards))s.newCards=[];
    s.newCards=s.newCards.filter(id=>CARD_IDS.includes(id));

    if(!num(s.taBest0))s.taBest0=state.ta[s.level].best;

}
function restoreCur(s){
  const c=s.cur;if(!c||c.idx!==s.idx||!num(c.start)||!num(c.miss))return null;
  const p=s.list[s.idx];
  if(c.ch!=null&&!(num(c.ch)&&c.ch>=0&&c.ch<3))return null;
  const n=(c.ch==null)?0:build(p,c.ch).ans.length;
  const arr=(a,f)=>Array.isArray(a)&&a.length===n&&a.every(f);
  if(c.ch!=null&&!(arr(c.vals,v=>typeof v==='string'&&/^\d{0,9}$/.test(v))&&arr(c.okb,v=>typeof v==='boolean')&&arr(c.bad,v=>typeof v==='boolean')&&arr(c.tries,num)))return null;

    active:num(c.active)&&c.active>=0&&c.active<Math.max(n,1)?c.active:0,miss:c.miss,start:c.start,done:c.done===true,stars:c.stars||null,
    newCards:Array.isArray(c.newCards)?c.newCards.filter(id=>CARD_IDS.includes(id)):[],fb:'',fbc:''};
}
function startProblem(fb,fbc){

  cur={ch:c?null:0,wrongOpts:[],vals:[],okb:[],bad:[],tries:[],active:0,miss:0,start:Date.now(),done:false,stars:null,newCards:[],fb:fb||'',fbc:fbc||''};

function setupBlanks(){const b=build(ses.list[ses.idx],cur.ch);cur.vals=b.ans.map(()=> '');cur.okb=b.ans.map(()=>false);cur.bad=b.ans.map(()=>false);cur.tries=b.ans.map(()=>0);cur.active=0;}
function chooseOpt(i){
  if(cur.done||cur.ch!=null||cur.wrongOpts.includes(i))return;const p=ses.list[ses.idx],t=typ(p);
  if(GATE.includes(t)){
    const ok=t==='hissan'?i===p.ci:p.opts[i]===p.a;
    if(!ok){cur.wrongOpts.push(i);cur.miss++;
      cur.fb=t==='hissan'?'ちがうよ。くわしい筆算は、1段めが「一の位×」、2段めが「十の位×」の答えだよ。':`${p.opts[i]} は、全部のかけ算にはないよ。どのかけ算にもある数をさがそう。`;
      cur.fbc='ng';saveSes();render();return;}
    cur.ch=i;cur.fb=t==='hissan'?'そのとおり！ 筆算を式で書いてみよう。':'そのとおり！ かっこの中を考えよう。';cur.fbc='ok';
  }else{cur.ch=i;cur.fb=p.my?(i===p.best?'自分で作った分け方！ やってみよう。':'その分け方でも計算できる。やってみよう。'):i===p.best?'いい分け方！':'その分け方でも計算できる。やってみよう。';cur.fbc='ok';}
  setupBlanks();saveSes();render();
}
function press(k){
  if(view!=='play'||!cur||cur.done)return;
  if(cur.ch==null){const n=parseInt(k,10);if(n>=1&&n<=3&&!cur.wrongOpts.includes(n-1))chooseOpt(n-1);return;}
  const i=cur.active;if(cur.okb[i])return;
  if(k==='del'){cur.vals[i]=cur.vals[i].slice(0,-1);cur.bad[i]=false;cur.fb='';cur.fbc='';render();return;}
  if(k==='ok'){if(cur.vals[i]!==''&&!cur.bad[i])check(i);return;} // まちがえた答えのままでは再判定しない
  if(!/^\d$/.test(k))return;

  if(cur.vals[i].length>=9)return; // マイ問題は 9999×9999（8けた）まであるので9けたまで
  cur.vals[i]+=k;
  const ans=build(ses.list[ses.idx],cur.ch).ans[i];
  if(cur.vals[i].length>=String(ans).length)check(i);else render();
}
function check(i){
  const b=build(ses.list[ses.idx],cur.ch);
  if(Number(cur.vals[i])===b.ans[i]){
    cur.okb[i]=true;cur.bad[i]=false;cur.fb='';cur.fbc='';
    const nx=cur.okb.findIndex(v=>!v);
    if(nx===-1){finish();return;}
    cur.active=nx;render();return;
  }
  cur.miss++;cur.tries[i]++;cur.bad[i]=true;
  cur.fb='おしい！ '+b.hints[i]+(cur.tries[i]>=2?`（答えは ${b.ans[i]}）`:'');cur.fbc='ng';
  saveSes();render(true);
}
function award(id){if(state.cards[id]||!CARD_IDS.includes(id))return;state.cards[id]=today();if(cur&&!cur.newCards.includes(id))cur.newCards.push(id);if(ses&&!ses.newCards.includes(id))ses.newCards.push(id);}
function problemCards(p,stars,best,sec,clean){
  const t=typ(p),skill=lvOf(p)>=SKILL_MIN; // きょうの難問は段3扱い
  if(clean&&!p.my){ // マイ問題では技のカードを出さない（ワールド3の技と取りちがえない）
  if(t==='xexp')award('xexp'); if(t==='xfactor')award('xfactor'); if(t==='xsame')award('xsame'); if(t==='xlike')award('xlike');
  if(t==='dots'&&stars===3)award('dots');
  if(t==='paren'){if(!state.forms.includes(p.form))state.forms.push(p.form);if(state.forms.length>=4)award('paren4');}
  if(t==='split'&&best){const o=p.opts[p.best];
    if(p.w===3&&o.x===100)award('r100'); if(p.w===3&&o.x>=1000)award('r1000'); if(p.w===4)award('minus');
    if(p.w===7&&p.k===0)award('n99'); if(p.w===7&&p.k===1)award('q25'); if(p.w===7&&p.k===4)award('n1001');}

  if(t==='grid')award('grid'); if(t==='hissan')award('hissan'); if(t==='dec')award('dec'); if(t==='group3')award('g3');

function updateReview(p,stars){

/* 別のタブで同じセッションが先に進んでいたら、点を足さずにそちらに合わせる */
function sessionMovedElsewhere(){

  if(!st||st.id!==ses.id){toast('別の画面でこの練習が終わっていました');ses=null;cur=null;go('home');return true;}
  if(Array.isArray(st.results)&&st.results.length!==ses.results.length){const s=loadSes();if(!s){ses=null;cur=null;go('home');return true;}

function finish(){

const $=id=>document.getElementById(id);
const app=$('app');
function go(v){view=VIEWS.includes(v)?v:'home';lsSet(VIEW,view);render();window.scrollTo(0,0);}
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>{t.style.display='none'},3200);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
/* 文字の x を斜体のセリフ体にする（esc の後で、英字に挟まれていない x だけを包む。× はそのまま） */
const vx=s=>esc(s).replace(/(^|[^A-Za-z])x(?![A-Za-z])/g,'$1<span class="vx">x</span>');

function render(shake){

}

function mkCheck(){
  const msg=$('mkMsg'),setNg=t=>{msg.className='fb ng';msg.textContent='⚠ '+t;mkOK=null;$('bMkSave').hidden=true;$('mkExpr').innerHTML='';};
  const g=k=>mk[k]===''?NaN:Number(mk[k]);const N=g('N'),m=g('m'),x=g('x'),y=g('y'),op=mk.op;
  if(!isInt(N,2,9999))return setNg('N には 2〜9999 の数を入れてね。');
  if(!isInt(m,2,9999))return setNg('m には 2〜9999 の数を入れてね。');
  if(!isInt(x,1,9999)||!isInt(y,1,9999))return setNg('x と y には 1〜9999 の数を入れてね。');
  if(op==='−'&&x<=y)return setNg(`ひき算の時は、x を y より大きくしてね（${x}−${y} は計算できない）。`);
  const s=op==='+'?x+y:x-y;
  if(s!==N)return setNg(`${x}${OPC(op)}${y} は ${s} だから、N の ${N} にならないよ。${op==='+'?'たして':'ひいて'} ${N} になる2つの数にしよう。`);
  const q={N,m,x,y,op},o=OPC(op);
  msg.className='fb ok';msg.textContent='✅ 合っている！ この分け方で計算できる。';
  $('mkExpr').innerHTML=[`${N}×${m}`,`＝ (${x}${o}${y})×${m}`,`＝ ${x}×${m} ${o} ${y}×${m}`,`＝ ${x*m} ${o} ${y*m}`,`＝ ${N*m}`].map(t=>`<div class="ln"><span>${esc(t)}</span></div>`).join('');
  mkOK=q;$('bMkSave').hidden=false;
}
function mkSave(){
  if(!mkOK||!validMy(mkOK))return;const q=mkOK;
  refreshState();
  if(state.myProblems.some(r=>r.N===q.N&&r.m===q.m&&r.x===q.x&&r.y===q.y&&r.op===q.op)){toast('同じ問題がもう入っています');return;}
  state.myProblems.push(q);if(state.myProblems.length>MY_MAX)state.myProblems.splice(0,state.myProblems.length-MY_MAX);
  const before=['maker','maker5'].filter(id=>state.cards[id]);award('maker');if(state.myProblems.length>=5)award('maker5');
  if(!saveState())return;
  const got=['maker','maker5'].filter(id=>state.cards[id]&&!before.includes(id));
  mk={N:'',m:'',x:'',y:'',op:mk.op};mkOK=null;render();
  toast('マイ問題に入れました'+(got.length?`　🃏 ${got.map(cardName).join('・')}`:''));
}

/* 読み込み前の控え（dl_state_v1_before_import_<時刻>）は新しい3件だけ残す。本体・BAK は触らない */
function pruneImportBak(){
  const pre=KEY+'_before_import_';let ks=[];
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(pre)&&/^\d+$/.test(k.slice(pre.length)))ks.push(k);}}catch(e){return;}
  ks.sort((a,b)=>Number(b.slice(pre.length))-Number(a.slice(pre.length)));
  for(const k of ks.slice(3))lsDel(k);
}
function importState(file){
  const msg=$('ioMsg'),ng=t=>{if(msg){msg.className='fb ng';msg.textContent='⚠ '+t;}};
  if(file.size>2e6)return ng('ファイルが大きすぎます。分配法則ラボで書き出したファイル（bunpai-lab-…json）を選んでね。');
  const rd=new FileReader();
  rd.onerror=()=>ng('ファイルを読めませんでした。もう一度ためしてね。');
  rd.onload=()=>{
    const imp=parseState(String(rd.result||''));
    if(!imp)return ng('このファイルは分配法則ラボの記録ではないか、こわれています。何も変えていません。');
    refreshState();
    if(!confirm(`今の記録（レベル${levelOf(state.xp)}・★${state.total.stars}）を、ファイルの記録（レベル${levelOf(imp.xp)}・★${imp.total.stars}）で置きかえます。よろしいですか？`))return;
    const raw=lsGet(KEY)||JSON.stringify(state);
    // 置きかえる前に今の記録を2か所に残す。残せなければ置きかえない
    if(!lsSet(BAK,raw)||!lsSet(KEY+'_before_import_'+Date.now(),raw))return ng('今の記録のひかえを残せなかったので、読み込みをやめました（保存領域がいっぱいかもしれません）。');
    pruneImportBak();
    const prev=state;state=imp;
    if(!saveState()){state=prev;return;}
    render();toast('記録を読み込みました');
  };
  rd.readAsText(file);
}

  if(cur.done){
    const s=cur.stars,two=typ(p)==='split'&&!p.my?'工夫した分け方でノーミス':'ノーミス';
    h+=`<div class="stars pop" aria-label="★${s.stars}つ">${[1,2,3].map(i=>`<span class="${i<=s.stars?'on':'off'}">★</span>`).join('')}</div>
      <ul class="starlist"><li>★ 正解</li><li>${s.s2?'★':'☆'} ${two}${!s.best?'（もっと楽な分け方があるよ）':''}</li><li>${s.s3?'★':'☆'} 目標時間内（${s.sec}秒）</li>${p.boss?'<li>👑 ボス問題なので点が2倍！</li>':''}${isFree(p)?`<li>${p.my?'✏️ マイ問題は点なしの練習（もらった点 +0）':'🧠 今日はクリア済みなので練習（もらった点 +0）'}</li>`:''}</ul>
      ${cur.newCards.map(id=>`<p class="newcard pop">🃏 新しい技カード「${vx(cardName(id))}」を手に入れた！</p>`).join('')}
      <p class="explain">${vx(explain(p,cur.ch,s.best))}</p>
      <button class="btn primary big" id="bNext">${ses.idx+1<ses.list.length?'つぎの問題へ ▶':'結果を見る ▶'}</button>`;
  }
  h+=`</section>`;
  if(!cur.done&&cur.ch!=null){
    h+=`<div class="keypad" role="group" aria-label="数字キー">`+['7','8','9','del','4','5','6','0','1','2','3','ok'].map(k=>{
      if(k==='del')return `<button class="key" data-k="del" aria-label="1文字消す">⌫</button>`;
      if(k==='ok')return `<button class="key go" data-k="ok">けってい</button>`;
      return `<button class="key" data-k="${k}">${k}</button>`;}).join('')+`</div>`;
  }
  app.innerHTML=h;
  $('bQuit').onclick=quit;
  app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>chooseOpt(Number(b.dataset.o)));
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>press(b.dataset.k));
  app.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.b);if(!cur.done&&!cur.okb[i]){cur.active=i;cur.fb='';cur.fbc='';render();}});
  const bn=$('bNext');if(bn){bn.onclick=next;bn.focus();}
  if(ta){const tick=()=>{if(Date.now()>=ses.endAt){clearInterval(timerId);timerId=null;endSession();return;}const e=$('tm');if(e)e.textContent=remain();};timerId=setInterval(tick,250);}
  else if(!cur.done){const tick=()=>{const e=$('tm');if(e)e.textContent=Math.floor((Date.now()-cur.start)/1000)};tick();timerId=setInterval(tick,1000);}
  else{const e=$('tm');if(e)e.textContent=cur.stars.sec;}
}
function renderResult(){
  let r=null;try{r=JSON.parse(lsGet(LAST)||'null')}catch(e){}
  if(!r||!num(r.n)||!num(r.stars)||!Array.isArray(r.worlds)){view='home';lsSet(VIEW,'home');renderHome();return;}
  const rl=isLv(r.level)?r.level:3, ta=r.mode==='ta'&&r.ta&&num(r.ta.n)?r.ta:null, rk=ta?rankOf(rl):null;
  let h=`<div class="topbar"><h1>分配法則ラボ</h1></div><section class="card pop"><p class="res-big">${r.mode==='mission'?'🎉 ミッションクリア！':ta?`⚡ ${TA_SEC}秒で ${ta.n}問！`:r.mode==='daily'?(r.free?'🧠 きょうの難問（今日はクリア済み・練習）':'🧠 きょうの難問 クリア！'):r.mode==='my'?'✏️ マイ問題おわり！':'練習おわり！'}</p>`;
  if(r.mode!=='daily'&&r.mode!=='my')h+=`<p class="muted" style="margin:0">むずかしさ ${rl} ${esc(DIFF_NAMES[rl])}</p>`;
  if(ta)h+=`<p>${ta.newBest?'<b>🏅 自己ベスト更新！</b>　':''}むずかしさ ${rl} の自己ベスト ${num(ta.best)?ta.best:0}問${rk?`　ランク <b>${esc(rk.name)}</b>（直近の平均 ${rk.avg}秒）`:''}</p>`;
  h+=`<p>★ ${r.stars} / ${r.n*3}　（★3つは ${num(r.three)?r.three:0}問）</p><p>もらった点 <b>+${num(r.xp)?r.xp:0}</b>${r.bonus?`（${r.mode==='daily'?'難問ボーナス':'ミッションボーナス'} ${r.bonus}点をふくむ）`:''}${r.free?(r.mode==='my'?'　マイ問題は点なしの練習です':'　今日はクリア済みなので練習（点なし）'):''}</p>`;
  if(r.lv1>r.lv0)h+=`<p class="res-big" style="color:var(--accent)">⬆ レベル${r.lv1}になった！ 「${esc(titleOf(r.lv1))}」</p>`;
  for(const id of (Array.isArray(r.cards)?r.cards:[])){const nm=cardName(id);if(nm)h+=`<p class="newcard">🃏 新しい技カード「${vx(nm)}」</p>`;}
  for(const x of r.worlds){const w=WORLDS[x.id-1];if(!w)continue;h+=`<p class="muted" style="margin:2px 0">ワールド${w.id} ${esc(w.name)}：習熟 ${x.p0} → <b>${x.p1}</b></p>`;}
  for(const id of (Array.isArray(r.newly)?r.newly:[])){const w=WORLDS[id-1];if(w)h+=`<p class="res-big" style="color:var(--accent)">🔓 ワールド${w.id}「${esc(w.name)}」が開いた！</p>`;}
  h+=`<div class="row" style="margin-top:12px"><button class="btn primary" id="bAgain">もう一度</button><button class="btn" id="bHome">ホームへ</button></div></section>`;
  app.innerHTML=h;
  $('bAgain').onclick=()=>newSession(r.mode,r.mode==='world'?(unlocked(r.w)?r.w:1):0);
  $('bHome').onclick=()=>go('home');$('bHome').focus();
}
document.addEventListener('keydown',e=>{
  if(view!=='play'||!cur||e.metaKey||e.ctrlKey||e.altKey)return;
  if(cur.done){const ae=document.activeElement;if(e.key==='Enter'&&!(ae&&ae.tagName==='BUTTON')){e.preventDefault();next();}return;}
  if(/^\d$/.test(e.key)){e.preventDefault();press(e.key);}
  else if(e.key==='Backspace'){e.preventDefault();press('del');}
  else if(e.key==='Enter'){if(document.activeElement&&document.activeElement.classList.contains('key'))return;e.preventDefault();press('ok');}
});
/* ===== 起動：直前の画面に戻す ===== */
(function boot(){
  const v=lsGet(VIEW);
  if(v==='play'){const s=loadSes();if(s){ses=s;
    if(s.mode==='ta'&&Date.now()>=s.endAt){cur=null;endSession();return;}
    cur=restoreCur(s);if(!cur)startProblem();view='play';render();return;}}
  if(v==='result'){view='result';render();return;}
  if(v==='cards'){view='cards';render();return;}
  if(v==='make'){view='make';render();return;}
  view='home';render();
})();
</script>
</body>
</html>
