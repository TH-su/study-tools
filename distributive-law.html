<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>分配法則ラボ</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1d2340; --sub:#555d7d; --line:#d9deec;
  --accent:#3b5bdb; --accent-ink:#ffffff; --accent-soft:#e3e9ff;
  --blue:#2f6fde; --orange:#d9680a; --ok:#1a8a4a; --ng:#c92a5e; --gold:#e09b00;
  --blue-soft:#dbe6ff; --orange-soft:#ffe3cc; --green-soft:#d4f3e1; --gray-soft:#eceef5; --cut:#c4c9d8; --shadow:0 2px 10px rgba(30,40,90,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141f; --card:#1b2030; --ink:#e8ebf7; --sub:#a9b0cb; --line:#2f3653;
    --accent:#7d95ff; --accent-ink:#0d1020; --accent-soft:#26305a;
    --blue:#77a2ff; --orange:#ffa452; --ok:#52d38d; --ng:#ff7fa6; --gold:#ffcb45;
    --blue-soft:#22325c; --orange-soft:#4a3119; --green-soft:#1c3d2b; --gray-soft:#2a3045; --cut:#3b4260; --shadow:0 2px 10px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#11141f; --card:#1b2030; --ink:#e8ebf7; --sub:#a9b0cb; --line:#2f3653;
  --accent:#7d95ff; --accent-ink:#0d1020; --accent-soft:#26305a;
  --blue:#77a2ff; --orange:#ffa452; --ok:#52d38d; --ng:#ff7fa6; --gold:#ffcb45;
  --blue-soft:#22325c; --orange-soft:#4a3119; --green-soft:#1c3d2b; --gray-soft:#2a3045; --cut:#3b4260; --shadow:0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;line-height:1.6;font-size:1rem}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.topbar h1{font-size:1.35rem;margin:0}
.back{color:var(--accent);text-decoration:none;font-size:.9rem;min-height:44px;display:inline-flex;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{margin:0 0 6px;font-size:1.1rem}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lv{display:flex;align-items:baseline;gap:8px}
.lv b{font-size:1.6rem}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font-size:.85rem;font-weight:700}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.muted{color:var(--sub);font-size:.9rem}
.streak{font-size:1.1rem;font-weight:700}
.btn{min-height:48px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{width:100%;font-size:1.15rem;min-height:60px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.blank:focus-visible,.opt:focus-visible,.key:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2 .card{margin-bottom:0}
.worlds{display:grid;gap:12px}
.world{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center}
.wnum{width:48px;height:48px;border-radius:12px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem}
.world h3{margin:0;font-size:1.05rem}
.world .ex{font-variant-numeric:tabular-nums;color:var(--sub);font-size:.9rem}
.badge{font-size:.8rem;font-weight:700;padding:1px 8px;border-radius:99px;border:1px solid var(--line);margin-left:6px;white-space:nowrap}
.badge.m1{background:var(--line)} .badge.m2{background:var(--blue-soft)} .badge.m3{background:var(--orange-soft)} .badge.m4{background:var(--gold);color:#1d2340}
.locked{opacity:.6}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:.8rem}
.cal .h{color:var(--sub);font-weight:700}
.cal .d{aspect-ratio:1;border-radius:8px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1.1}
.cal .d.done{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:800}
.cal .d.frz{background:var(--blue-soft)}
.cal .d.today{outline:2px solid var(--gold)}
.cal .d.fut{opacity:.35}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px}
.tcard{border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--card);text-align:center}
.tcard .e{font-size:2rem;line-height:1.2}
.tcard b{display:block;font-size:.95rem}
.tcard.on{border-color:var(--gold)}
.tcard.off .e{filter:grayscale(1);opacity:.35}
.newcard{font-weight:800;color:var(--accent)}
/* play */
.playhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.prog{display:flex;gap:4px;flex-wrap:wrap}
.prog i{width:14px;height:14px;border-radius:4px;background:var(--line);display:block}
.prog i.d{background:var(--accent)} .prog i.c{outline:2px solid var(--gold)} .prog i.boss{border-radius:50%}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.ta{font-size:1.2rem;color:var(--ng)}
.qtitle{font-size:1.1rem;font-weight:700;margin:0 0 6px}
.diagram{display:flex;justify-content:center;margin:6px 0 10px;overflow-x:auto}
.diagram svg{max-width:100%;height:auto}
.expr{font-size:1.35rem;font-variant-numeric:tabular-nums;font-weight:700;display:grid;gap:6px;margin:6px 0 10px}
.expr .ln{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.expr .ln > span{min-width:0}
.blank{min-width:64px;min-height:48px;padding:4px 10px;border-radius:10px;border:2px dashed var(--sub);background:var(--bg);font-size:1.3rem;font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
.blank.act{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.blank.ok{border-style:solid;border-color:var(--ok);color:var(--ok);cursor:default}
.blank.ng{border-style:solid;border-color:var(--ng);color:var(--ng)}
.choice p{margin:4px 0 8px;font-weight:700}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.opt{min-height:56px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:1.25rem;font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
.opt:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.fb{min-height:1.6em;font-weight:700;margin:4px 0}
.fb.ng{color:var(--ng)} .fb.ok{color:var(--ok)}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.key{min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:1.35rem;font-weight:800;cursor:pointer;box-shadow:var(--shadow)}
.key.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:1.05rem;white-space:nowrap}
.stars{font-size:2rem;letter-spacing:4px}
.stars .on{color:var(--gold)} .stars .off{color:var(--line)}
.starlist{list-style:none;padding:0;margin:6px 0;display:grid;gap:2px}
.starlist li{font-size:.95rem}
.done-panel{border:2px solid var(--ok)}
.boss-panel{border:2px solid var(--gold)}
.explain{margin:6px 0 10px}
.res-big{font-size:1.5rem;font-weight:800;margin:0 0 6px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;max-width:90vw;z-index:10;display:none}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion: reduce){ .pop,.shake{animation:none} }
@media (max-width:560px){ .grid2{grid-template-columns:1fr} }
@media (max-width:420px){ .expr{font-size:1.15rem} .blank{min-width:56px;font-size:1.15rem} .world{grid-template-columns:40px 1fr} .world .act-col{grid-column:1 / -1} .wnum{width:40px;height:40px} }
/* svg */
.sv-blue{fill:var(--blue-soft);stroke:var(--blue);stroke-width:2}
.sv-orange{fill:var(--orange-soft);stroke:var(--orange);stroke-width:2}
.sv-green{fill:var(--green-soft);stroke:var(--ok);stroke-width:2}
.sv-gray{fill:var(--gray-soft);stroke:var(--sub);stroke-width:2}
.sv-cut{fill:url(#dl-hatch);stroke:var(--ng);stroke-width:2;stroke-dasharray:5 4}
.sv-dotb{fill:var(--blue)} .sv-doto{fill:var(--orange)}
.sv-t{fill:var(--ink);font-size:15px;font-weight:700;font-family:inherit}
.sv-tb{fill:var(--blue);font-size:15px;font-weight:800}
.sv-to{fill:var(--orange);font-size:15px;font-weight:800}
.sv-tg{fill:var(--ok);font-size:15px;font-weight:800}
.sv-ts{fill:var(--sub);font-size:15px;font-weight:800}
.sv-tn{fill:var(--ng);font-size:15px;font-weight:800}
.sv-big{fill:var(--ink);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.sv-bigb{fill:var(--blue);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.sv-hatch{stroke:var(--ng);stroke-width:1.5}
.sv-rule{stroke:var(--ink);stroke-width:2}
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="off"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ===== 定数 ===== */
const KEY='dl_state_v1', BAK='dl_state_v1_bak', SES='dl_session_v1', LAST='dl_last_result_v1', VIEW='dlcfg_view';
const VIEWS=['home','play','result','cards'];
const WORLDS=[
  {id:1,name:'見える分配',sub:'点の図を2つに分けてかける',ex:'4×(3＋5)',target:30},
  {id:2,name:'かっこを開く',sub:'4つの形を使いこなす',ex:'6×(20−3)',target:35},
  {id:3,name:'工夫・たし算',sub:'キリのよい数＋あまりに分ける',ex:'102×7',target:30},
  {id:4,name:'工夫・ひき算',sub:'キリのよい数から少しひく',ex:'98×7',target:35},
  {id:5,name:'まとめる',sub:'同じ数でくくって一発で',ex:'37×6＋37×4',target:35},
  {id:6,name:'4つの部屋',sub:'2けた×2けたを面積図で・筆算の中の分配法則',ex:'23×47',target:45},
  {id:7,name:'達人の技',sub:'99・25・1001・小数・3つまとめ',ex:'25×44',target:40},
];
const UNLOCK=30, GOOD=60, MASTER=100, GOOD_DAYS=2, MASTER_DAYS=3; // とくい・マスターは別の日にも練習した時だけ
const TITLES=['たまご','ひよこ','見習い','けいさん職人','くふう名人','ぶんぱい達人','分配博士','大博士','伝説の数学者'];
const MISSION_N=10, PRACTICE_N=5, MISSION_BONUS=30, TA_SEC=60, REVIEW_MAX=3, REVIEW_STEPS=[1,3,7];
const RANKS=[{max:8,n:'いなずま'},{max:12,n:'ジェット'},{max:18,n:'ロケット'},{max:25,n:'じてんしゃ'},{max:1e9,n:'あるき'}];
const CARDS=[
  {id:'dots',e:'🔵',n:'点の図マスター',d:'ワールド1で★3をとる'},
  {id:'paren4',e:'🧩',n:'4つの形',d:'ワールド2の4つの形をぜんぶ解く'},
  {id:'r100',e:'💯',n:'100にする技',d:'100＋あまり に分けて解く'},
  {id:'r1000',e:'🏔',n:'1000にする技',d:'1000以上＋あまり に分けて解く'},
  {id:'minus',e:'✂️',n:'切り取りの技',d:'キリのよい数−少し で解く'},
  {id:'group',e:'🤝',n:'くくる技',d:'同じ数でまとめて解く'},
  {id:'group100',e:'🎯',n:'100でくくる',d:'まとめると100になる問題を解く'},
  {id:'grid',e:'🏠',n:'4つの部屋',d:'2けた×2けたを4つに分けて解く'},
  {id:'hissan',e:'📝',n:'筆算の秘密',d:'筆算の中に分配法則を見つける'},
  {id:'n99',e:'🎱',n:'99の技',d:'99×2けたを 100−1 で解く'},
  {id:'q25',e:'🪙',n:'25の技',d:'25×4＝100 を使って解く'},
  {id:'dec',e:'🔸',n:'小数でも使える',d:'小数の分配法則を解く'},
  {id:'g3',e:'🧺',n:'3つまとめ',d:'3つのかけ算を1つにまとめる'},
  {id:'n1001',e:'🪞',n:'1001の不思議',d:'1001×数 を 1000＋1 で解く'},
  {id:'boss',e:'👑',n:'ボスたおし',d:'ボス問題を★2以上で解く'},
  {id:'boss5',e:'🏆',n:'ボスハンター',d:'ボス問題を5回たおす'},
  {id:'speed',e:'⚡',n:'いなずま',d:'1問を10秒以内で解く'},
  {id:'perfect',e:'🌟',n:'パーフェクト',d:'ミッション10問すべて★3'},
  {id:'review',e:'🔁',n:'ふくしゅう名人',d:'ふくしゅう問題を★3で解く'},
  {id:'ta8',e:'⏱',n:'60秒で8問',d:'タイムアタックで8問以上解く'},
  {id:'st3',e:'🔥',n:'3日れんぞく',d:'ミッションを3日つづける'},
  {id:'st7',e:'🔥',n:'1週間れんぞく',d:'ミッションを7日つづける'},
  {id:'st30',e:'🌋',n:'30日れんぞく',d:'ミッションを30日つづける'},
  {id:'master',e:'🎓',n:'はじめてのマスター',d:'どれかのワールドをマスターにする'},
  {id:'lv10',e:'🚀',n:'レベル10',d:'レベル10になる'},
];
const CARD_IDS=CARDS.map(c=>c.id);

/* ===== 保存（失敗しても既存データを残す） ===== */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
const num=v=>typeof v==='number'&&isFinite(v);
const isDate=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v);
function defaultState(){return {v:1,xp:0,worlds:{},days:{},total:{solved:0,stars:0},cards:{},review:[],ta:{best:0,recent:[]},bossWins:0,forms:[]}}
function normalize(s){
  const o=defaultState();
  o.xp=num(s.xp)&&s.xp>=0?Math.floor(s.xp):0;
  if(s.total&&typeof s.total==='object'){o.total.solved=num(s.total.solved)?s.total.solved:0;o.total.stars=num(s.total.stars)?s.total.stars:0;}
  for(const w of WORLDS){const x=s.worlds&&s.worlds[w.id];if(x&&typeof x==='object'){o.worlds[w.id]={pts:num(x.pts)?Math.max(0,Math.min(MASTER,x.pts)):0,n:num(x.n)?x.n:0,three:num(x.three)?x.three:0,days:num(x.days)?x.days:0,last:isDate(x.last)?x.last:''};}}
  if(s.days&&typeof s.days==='object'){for(const k of Object.keys(s.days)){if(isDate(k)){const d=s.days[k]||{};o.days[k]={mission:d.mission===true,solved:num(d.solved)?d.solved:0,stars:num(d.stars)?d.stars:0};}}}
  if(s.cards&&typeof s.cards==='object'){for(const id of CARD_IDS){if(isDate(s.cards[id]))o.cards[id]=s.cards[id];}}
  if(Array.isArray(s.review))o.review=s.review.filter(r=>r&&num(r.w)&&r.w>=1&&r.w<=WORLDS.length&&num(r.k)&&isDate(r.due)&&num(r.step)).slice(-30).map(r=>({w:r.w,k:r.k,due:r.due,step:r.step}));
  if(s.ta&&typeof s.ta==='object'){o.ta.best=num(s.ta.best)?s.ta.best:0;o.ta.recent=Array.isArray(s.ta.recent)?s.ta.recent.filter(num).slice(-10):[];}
  o.bossWins=num(s.bossWins)?s.bossWins:0;
  o.forms=Array.isArray(s.forms)?[...new Set(s.forms.filter(f=>[0,1,2,3].includes(f)))]:[];
  return o;
}
function parseState(raw){if(!raw)return null;try{const s=JSON.parse(raw);if(!s||typeof s!=='object'||s.v!==1)return null;return normalize(s)}catch(e){return null}}
function loadState(){
  const raw=lsGet(KEY);
  if(raw==null){return parseState(lsGet(BAK))||defaultState();}
  const s=parseState(raw); if(s)return s;
  lsSet(KEY+'_corrupt_'+Date.now(),raw); // 壊れた元データは消さずに別名で残す
  return parseState(lsGet(BAK))||defaultState();
}
let state=loadState();
/* 変更の直前に呼ぶ：別タブで進んだデータがあれば、それに足す（上書きで消さない） */
function refreshState(){const s=parseState(lsGet(KEY));if(s&&s.xp>=state.xp)state=s;}
function saveState(){
  const cur=lsGet(KEY); const curS=parseState(cur);
  if(curS)lsSet(BAK,cur);
  if(!lsSet(KEY,JSON.stringify(state))){toast('保存できませんでした（このブラウザの保存領域が使えません）');return false;}
  return true;
}
window.addEventListener('storage',e=>{if(e.key===KEY){const s=parseState(e.newValue);if(s&&s.xp>=state.xp){state=s;if(view==='home'||view==='cards')render();}}});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});}catch(e){}

/* ===== 日付・連続日数 ===== */
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const weekKey=d=>dkey(addDays(d,-((d.getDay()+6)%7)));
const isDone=k=>!!(state.days[k]&&state.days[k].mission);
function streakInfo(){
  const now=new Date(); const todayDone=isDone(dkey(now));
  let d=todayDone?now:addDays(now,-1); let count=0; const used={}, frozen={};
  for(let i=0;i<3000;i++){
    const k=dkey(d);
    if(isDone(k)){count++;d=addDays(d,-1);continue;}
    const wk=weekKey(d);
    if(!used[wk]&&isDone(dkey(addDays(d,-1)))){used[wk]=true;frozen[k]=true;d=addDays(d,-1);continue;}
    break;
  }
  return {count,frozen,todayDone,freezeLeft:used[weekKey(now)]?0:1};
}

/* ===== レベル・習熟・ランク ===== */
const need=L=>20*(L-1)*L;
function levelOf(xp){let L=1;while(xp>=need(L+1))L++;return L}
const titleOf=L=>TITLES[Math.min(Math.floor((L-1)/2),TITLES.length-1)];
const wstat=id=>state.worlds[id]||{pts:0,n:0,three:0,days:0,last:''};
function mastery(id){const s=wstat(id);if(!s.n)return {lv:0,name:'未挑戦'};if(s.pts>=MASTER&&s.days>=MASTER_DAYS)return {lv:4,name:'マスター'};if(s.pts>=GOOD&&s.days>=GOOD_DAYS)return {lv:3,name:'とくい'};if(s.pts>=UNLOCK)return {lv:2,name:'できた'};return {lv:1,name:'挑戦中'}}
const unlocked=id=>id===1||wstat(id-1).pts>=UNLOCK;
function rankOf(){const r=state.ta.recent;if(r.length<3)return null;const avg=r.reduce((a,b)=>a+b,0)/r.length;return {avg:Math.round(avg*10)/10,name:RANKS.find(x=>avg<=x.max).n};}

/* ===== 問題づくり ===== */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const notTen=(a,b)=>{let x;do{x=rnd(a,b)}while(x%10===0);return x};
function splitPlus(w,R,m,extra){const k=rnd(1,9),N=R+k;const best={x:R,y:k,op:'+'},d1={x:R-10,y:k+10,op:'+'};
  const d2=N%2===0?{x:N/2,y:N/2,op:'+'}:{x:R-20,y:k+20,op:'+'};const opts=shuffle([best,d1,d2]);

function gridSVG(p,solved){
  const x1=p.a1*10,x2=p.a2,y1=p.b1*10,y2=p.b2,ox=44,oy=28,TW=270,TH=170;
  const wa=Math.max(60,Math.min(TW-60,TW*x1/(x1+x2))),wb=TW-wa,ha=Math.max(56,Math.min(TH-56,TH*y1/(y1+y2))),hb=TH-ha;
  const cells=[[ox,oy,wa,ha,x1*y1],[ox,oy+ha,wa,hb,x1*y2],[ox+wa,oy,wb,ha,x2*y1],[ox+wa,oy+ha,wb,hb,x2*y2]];
  let g='';cells.forEach((c,i)=>{g+=`<rect x="${c[0]}" y="${c[1]}" width="${c[2]}" height="${c[3]}" class="${PCLS[i]}"/>`;if(solved)g+=`<text x="${c[0]+c[2]/2}" y="${c[1]+c[3]/2+5}" text-anchor="middle" class="${TCLS[i]}">${c[4]}</text>`;});
  g+=`<text x="${ox+wa/2}" y="20" text-anchor="middle" class="sv-t">${x1}</text><text x="${ox+wa+wb/2}" y="20" text-anchor="middle" class="sv-t">${x2}</text>`;
  g+=`<text x="20" y="${oy+ha/2+5}" text-anchor="middle" class="sv-t">${y1}</text><text x="20" y="${oy+ha+hb/2+5}" text-anchor="middle" class="sv-t">${y2}</text>`;
  const W=ox+TW+10,H=oy+TH+10;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="よこ${x1}と${x2}、たて${y1}と${y2}に分けた4つの部屋の面積図">${g}</svg>`;
}
function hissanSVG(p,solved){
  const R=130,LX=150;let g='';const row=(y,txt,cls)=>`<text x="${R}" y="${y}" text-anchor="end" class="${cls}">${txt}</text>`;
  g+=row(30,p.A,'sv-big')+`<text x="40" y="62" class="sv-big">×</text>`+row(62,p.m,'sv-big');
  g+=`<line x1="34" y1="72" x2="${R+4}" y2="72" class="sv-rule"/>`;
  g+=row(100,solved?p.u*p.m:'？','sv-big')+row(132,solved?p.t*p.m:'？','sv-bigb');
  g+=`<line x1="34" y1="142" x2="${R+4}" y2="142" class="sv-rule"/>`;
  g+=row(172,solved?p.A*p.m:'？','sv-big');
  g+=`<text x="${LX}" y="98" class="sv-t">← 1段め${solved?`（${p.u}×${p.m}）`:''}</text><text x="${LX}" y="130" class="sv-tb">← 2段め${solved?`（${p.t}×${p.m}）`:''}</text>`;
  return `<svg viewBox="0 0 330 185" width="330" height="185" role="img" aria-label="${p.A}かける${p.m}のくわしい筆算${solved?`。1段めが${p.u*p.m}、2段めが${p.t*p.m}`:''}">${g}</svg>`;
}
function diagram(p,ch,solved){
  const t=typ(p);
  if(t==='dots')return dotsSVG(p.a,p.b,p.c,solved);
  if(t==='paren')return rect2(p.a,p.b,p.c,p.form%2===1,solved);
  if(t==='grid')return gridSVG(p,solved);
  if(t==='hissan')return hissanSVG(p,solved);
  if(t==='dec')return areaN(fmt(p.a10),[{v:p.b,lab:p.b,area:p.a10*p.b/10},{v:p.c10/10,lab:fmt(p.c10),area:p.a10*p.c10/100}],solved);
  if(ch==null)return '';
  if(t==='split'){const o=p.opts[ch];return rect2(p.m,o.x,o.y,o.op==='−',solved);}
  if(t==='group')return rect2(p.a,p.b,p.c,p.op==='−',solved);
  return areaN(p.a,[p.b,p.c,p.d].map(v=>({v,lab:v,area:p.a*v})),solved);
}

/* ===== セッション ===== */
let view='home', ses=null, cur=null, timerId=null;
const today=()=>dkey(new Date());
const dueReviews=()=>state.review.filter(r=>r.due<=today()&&unlocked(r.w));
function weightedWorld(U){const ws=U.map(id=>MASTER+20-wstat(id).pts);let r=Math.random()*ws.reduce((a,b)=>a+b,0),i=0;while(r>=ws[i]&&i<ws.length-1){r-=ws[i];i++;}return U[i];}
function genTA(){return gen(pick(WORLDS.filter(x=>x.id<=5&&unlocked(x.id)).map(x=>x.id)));}
function newSession(mode,w){
  const list=[];
  if(mode==='world'){for(let i=0;i<PRACTICE_N-1;i++)list.push(gen(w));list.push(Object.assign(gen(w,{hard:true}),{boss:true}));}
  else if(mode==='ta'){list.push(genTA());}
  else{
    for(const r of dueReviews().slice(0,REVIEW_MAX))list.push(Object.assign(gen(r.w,{k:r.k}),{rev:true}));
    const U=WORLDS.filter(x=>unlocked(x.id)).map(x=>x.id);
    while(list.length<MISSION_N)list.push(gen(weightedWorld(U)));
  }
  ses={id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),mode,w:w||0,list,idx:0,results:[],newCards:[],xp0:state.xp,taBest0:state.ta.best,pts0:Object.fromEntries(WORLDS.map(x=>[x.id,wstat(x.id).pts])),unl0:WORLDS.filter(x=>unlocked(x.id)).map(x=>x.id),day:today()};
  if(mode==='ta')ses.endAt=Date.now()+TA_SEC*1000;
  cur=null;startProblem();go('play');
}
function saveSes(){
  if(!ses)return;
  if(ses.id){let st=null;try{st=JSON.parse(lsGet(SES)||'null')}catch(e){}
    // 別のタブで同じセッションが先に進んでいる・別のセッションに替わった時は上書きしない
    if(st&&st.id===ses.id&&Array.isArray(st.results)&&st.results.length>ses.results.length)return;
    if(ses.results.length>0&&(!st||st.id!==ses.id))return;}
  if(cur)ses.cur=Object.assign({idx:ses.idx},cur);lsSet(SES,JSON.stringify(ses));
}
function loadSes(){
  try{const s=JSON.parse(lsGet(SES)||'null');
    if(!s||!['mission','world','ta'].includes(s.mode)||!Array.isArray(s.list)||!s.list.length||!s.list.every(validP)||!num(s.idx)||s.idx<0||s.idx>=s.list.length||!Array.isArray(s.results))return null;
    if(!num(s.xp0)||!s.pts0||!Array.isArray(s.unl0))return null;
    if(s.mode==='ta'&&!num(s.endAt))return null;
    if(!isDate(s.day))s.day=today();
    if(!Array.isArray(s.newCards))s.newCards=[];
    s.newCards=s.newCards.filter(id=>CARD_IDS.includes(id));
    if(!num(s.taBest0))s.taBest0=state.ta.best;
    return s;}catch(e){return null}
}
function restoreCur(s){
  const c=s.cur;if(!c||c.idx!==s.idx||!num(c.start)||!num(c.miss))return null;
  const p=s.list[s.idx];
  if(c.ch!=null&&!(num(c.ch)&&c.ch>=0&&c.ch<3))return null;
  const n=(c.ch==null)?0:build(p,c.ch).ans.length;
  const arr=(a,f)=>Array.isArray(a)&&a.length===n&&a.every(f);
  if(c.ch!=null&&!(arr(c.vals,v=>typeof v==='string'&&/^\d{0,7}$/.test(v))&&arr(c.okb,v=>typeof v==='boolean')&&arr(c.bad,v=>typeof v==='boolean')&&arr(c.tries,num)))return null;
  if(c.done&&!(c.stars&&num(c.stars.stars)))return null;
  return {ch:c.ch,wrongOpts:Array.isArray(c.wrongOpts)?c.wrongOpts.filter(num):[],vals:c.vals||[],okb:c.okb||[],bad:c.bad||[],tries:c.tries||[],
    active:num(c.active)&&c.active>=0&&c.active<Math.max(n,1)?c.active:0,miss:c.miss,start:c.start,done:c.done===true,stars:c.stars||null,
    newCards:Array.isArray(c.newCards)?c.newCards.filter(id=>CARD_IDS.includes(id)):[],fb:'',fbc:''};
}
function startProblem(fb,fbc){
  const p=ses.list[ses.idx];const c=choiceOf(p);
  cur={ch:c?null:0,wrongOpts:[],vals:[],okb:[],bad:[],tries:[],active:0,miss:0,start:Date.now(),done:false,stars:null,newCards:[],fb:fb||'',fbc:fbc||''};
  if(!c)setupBlanks();
  saveSes();
}
function setupBlanks(){const b=build(ses.list[ses.idx],cur.ch);cur.vals=b.ans.map(()=> '');cur.okb=b.ans.map(()=>false);cur.bad=b.ans.map(()=>false);cur.tries=b.ans.map(()=>0);cur.active=0;}
function chooseOpt(i){
  if(cur.done||cur.ch!=null||cur.wrongOpts.includes(i))return;const p=ses.list[ses.idx],t=typ(p);
  if(GATE.includes(t)){
    const ok=t==='hissan'?i===p.ci:p.opts[i]===p.a;
    if(!ok){cur.wrongOpts.push(i);cur.miss++;
      cur.fb=t==='hissan'?'ちがうよ。くわしい筆算は、1段めが「一の位×」、2段めが「十の位×」の答えだよ。':`${p.opts[i]} は、全部のかけ算にはないよ。どのかけ算にもある数をさがそう。`;
      cur.fbc='ng';saveSes();render();return;}
    cur.ch=i;cur.fb=t==='hissan'?'そのとおり！ 筆算を式で書いてみよう。':'そのとおり！ かっこの中を考えよう。';cur.fbc='ok';
  }else{cur.ch=i;cur.fb=i===p.best?'いい分け方！':'その分け方でも計算できる。やってみよう。';cur.fbc='ok';}
  setupBlanks();saveSes();render();
}
function press(k){
  if(view!=='play'||!cur||cur.done)return;
  if(cur.ch==null){const n=parseInt(k,10);if(n>=1&&n<=3&&!cur.wrongOpts.includes(n-1))chooseOpt(n-1);return;}
  const i=cur.active;if(cur.okb[i])return;
  if(k==='del'){cur.vals[i]=cur.vals[i].slice(0,-1);cur.bad[i]=false;cur.fb='';cur.fbc='';render();return;}
  if(k==='ok'){if(cur.vals[i]!==''&&!cur.bad[i])check(i);return;} // まちがえた答えのままでは再判定しない
  if(!/^\d$/.test(k))return;
  if(cur.bad[i]){cur.vals[i]='';cur.bad[i]=false;} // まちがえた空欄は、打ち直すと最初から
  if(cur.vals[i].length>=7)return;
  cur.vals[i]+=k;
  const ans=build(ses.list[ses.idx],cur.ch).ans[i];
  if(cur.vals[i].length>=String(ans).length)check(i);else render();
}
function check(i){
  const b=build(ses.list[ses.idx],cur.ch);
  if(Number(cur.vals[i])===b.ans[i]){
    cur.okb[i]=true;cur.bad[i]=false;cur.fb='';cur.fbc='';
    const nx=cur.okb.findIndex(v=>!v);
    if(nx===-1){finish();return;}
    cur.active=nx;render();return;
  }
  cur.miss++;cur.tries[i]++;cur.bad[i]=true;
  cur.fb='おしい！ '+b.hints[i]+(cur.tries[i]>=2?`（答えは ${b.ans[i]}）`:'');cur.fbc='ng';
  saveSes();render(true);
}
function award(id){if(state.cards[id]||!CARD_IDS.includes(id))return;state.cards[id]=today();if(cur&&!cur.newCards.includes(id))cur.newCards.push(id);if(ses&&!ses.newCards.includes(id))ses.newCards.push(id);}
function problemCards(p,stars,best,sec,clean){
  const t=typ(p);
  if(clean){
  if(t==='dots'&&stars===3)award('dots');
  if(t==='paren'){if(!state.forms.includes(p.form))state.forms.push(p.form);if(state.forms.length>=4)award('paren4');}
  if(t==='split'&&best){const o=p.opts[p.best];
    if(p.w===3&&o.x===100)award('r100'); if(p.w===3&&o.x>=1000)award('r1000'); if(p.w===4)award('minus');
    if(p.w===7&&p.k===0)award('n99'); if(p.w===7&&p.k===1)award('q25'); if(p.w===7&&p.k===4)award('n1001');}
  if(t==='group'){award('group');if(p.T===100)award('group100');}
  if(t==='grid')award('grid'); if(t==='hissan')award('hissan'); if(t==='dec')award('dec'); if(t==='group3')award('g3');
  if(sec<=10)award('speed');
  }
  if(p.boss&&stars>=2){state.bossWins++;award('boss');if(state.bossWins>=5)award('boss5');}
  if(p.rev&&stars===3)award('review');
  if(WORLDS.some(w=>mastery(w.id).lv===4))award('master');
  if(levelOf(state.xp)>=10)award('lv10');
}
function updateReview(p,stars){
  const k=kOf(p),q=state.review,ix=q.findIndex(r=>r.w===p.w&&r.k===k);
  if(stars<3){const it={w:p.w,k,due:dkey(addDays(new Date(),REVIEW_STEPS[0])),step:0};if(ix>=0)q[ix]=it;else{q.push(it);if(q.length>30)q.shift();}}
  else if(p.rev&&ix>=0){const st=q[ix].step+1;if(st>=REVIEW_STEPS.length)q.splice(ix,1);else{q[ix].step=st;q[ix].due=dkey(addDays(new Date(),REVIEW_STEPS[st]));}}
}
/* 別のタブで同じセッションが先に進んでいたら、点を足さずにそちらに合わせる */
function sessionMovedElsewhere(){
  if(!ses||!ses.id)return false;
  let st=null;try{st=JSON.parse(lsGet(SES)||'null')}catch(e){}
  if(!st||st.id!==ses.id){toast('別の画面でこの練習が終わっていました');ses=null;cur=null;go('home');return true;}
  if(Array.isArray(st.results)&&st.results.length!==ses.results.length){const s=loadSes();if(!s){ses=null;cur=null;go('home');return true;}
    ses=s;cur=restoreCur(s);if(!cur)startProblem();toast('別の画面で進んでいたので、そちらに合わせました');render();return true;}
  return false;
}
function finish(){
  if(sessionMovedElsewhere())return;
  const p=ses.list[ses.idx],w=WORLDS[p.w-1];
  const sec=Math.round((Date.now()-cur.start)/1000);
  const best=typ(p)==='split'?cur.ch===p.best:true;
  const s2=cur.miss===0&&best, s3=sec<=w.target;
  const stars=1+(s2?1:0)+(s3?1:0);
  cur.done=true;cur.stars={stars,s2,s3,sec,best};
  const gain=(10+5*(stars-1))*(p.boss?2:1);
  refreshState();
  state.xp+=gain;
  const ws=state.worlds[p.w]||(state.worlds[p.w]={pts:0,n:0,three:0,days:0,last:''});
  ws.n++;if(stars===3)ws.three++;ws.pts=Math.min(MASTER,ws.pts+2+(s2?2:0)+(s3?2:0));
  const dk=today();if(ws.last!==dk){ws.days++;ws.last=dk;}
  state.total.solved++;state.total.stars+=stars;
  const dd=state.days[dk]||(state.days[dk]={mission:false,solved:0,stars:0});dd.solved++;dd.stars+=stars;
  if(ses.mode!=='ta')updateReview(p,stars);
  problemCards(p,stars,best,sec,s2);
  ses.results.push({w:p.w,stars,sec,gain});
  saveState();
  if(ses.mode==='ta'){
    if(Date.now()>=ses.endAt){endSession();return;}
    const nc=cur.newCards.map(cardName);
    ses.list.push(genTA());ses.idx++;
    startProblem(`⭕ ${ses.results.length}問め クリア！`+(nc.length?`　🃏 ${nc.join('・')}`:''),'ok');render();return;
  }
  saveSes();cur.fb='';render();
}
function next(){
  if(!cur||!cur.done)return;
  ses.idx++;
  if(ses.idx<ses.list.length){startProblem();render();window.scrollTo(0,0);return;}
  endSession();
}
function endSession(){
  let bonus=0;const dk=ses.day||today();refreshState();
  if(ses.mode==='mission'){const dd=state.days[dk]||(state.days[dk]={mission:false,solved:0,stars:0});if(!dd.mission){dd.mission=true;bonus=MISSION_BONUS;state.xp+=bonus;}
    if(ses.results.length===MISSION_N&&ses.results.every(r=>r.stars===3))award('perfect');
    const sc=streakInfo().count;if(sc>=3)award('st3');if(sc>=7)award('st7');if(sc>=30)award('st30');}
  let ta=null;
  if(ses.mode==='ta'){const n=ses.results.length;state.ta.best=Math.max(state.ta.best,n);state.ta.recent=state.ta.recent.concat(ses.results.map(r=>r.sec)).slice(-10);
    if(n>=8)award('ta8');ta={n,best:state.ta.best,newBest:n>0&&n>(ses.taBest0||0)};}
  if(levelOf(state.xp)>=10)award('lv10');
  saveState();
  const res={mode:ses.mode,w:ses.w,n:ses.results.length,stars:ses.results.reduce((a,r)=>a+r.stars,0),three:ses.results.filter(r=>r.stars===3).length,
    xp:ses.results.reduce((a,r)=>a+r.gain,0)+bonus,bonus,lv0:levelOf(ses.xp0),lv1:levelOf(state.xp),ta,cards:ses.newCards.slice(),
    worlds:[...new Set(ses.results.map(r=>r.w))].map(id=>({id,p0:ses.pts0[id]||0,p1:wstat(id).pts})),
    newly:WORLDS.filter(x=>unlocked(x.id)&&!ses.unl0.includes(x.id)).map(x=>x.id)};
  lsSet(LAST,JSON.stringify(res));lsDel(SES);ses=null;cur=null;go('result');
}
function quit(){
  if(ses&&ses.mode!=='ta'&&ses.results.length<ses.list.length&&!(cur&&cur.done&&ses.idx===ses.list.length-1)&&!confirm('とちゅうでやめますか？（解いた問題の点はのこります）'))return;
  if(ses&&ses.mode==='ta'&&!confirm('タイムアタックをやめますか？（記録はのこりません。解いた問題の点はのこります）'))return;
  lsDel(SES);ses=null;cur=null;go('home');
}

      <div class="ex">${esc(w.sub)}（例 ${esc(w.ex)}）</div>
      <div class="row" style="margin-top:4px"><div class="bar" role="progressbar" aria-label="ワールド${w.id}の習熟" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${s.pts}"><i style="width:${s.pts}%"></i></div><span class="muted">${s.pts}/100・${s.days||0}日</span></div>
      ${u?'':`<div class="muted">ワールド${w.id-1}を「できた」（30点）にすると開く</div>`}</div>
      <div class="act-col"><button class="btn" data-w="${w.id}" ${u?'':'disabled'} aria-label="ワールド${w.id}を${PRACTICE_N}問練習（最後はボス問題）">練習 ${PRACTICE_N}問</button></div></div>`;
  }
  h+=`</div><p class="muted" style="margin:10px 0 0">★の取り方：正解で★1、まちがえず工夫した分け方で★2、目標時間内で★3。まちがえても点は減りません。練習の5問めは 👑ボス問題（点が2倍）。★3がとれなかった型は、次の日から ふくしゅう に出ます。習熟は「とくい」に2日、「マスター」に3日、別の日の練習が必要です。</p></section>`;
  // カレンダー（4週）
  const now=new Date(),start=addDays(now,-((now.getDay()+6)%7)-21);
  h+=`<section class="card"><h2>4週間の記録</h2><div class="cal">`+['月','火','水','木','金','土','日'].map(x=>`<div class="h">${x}</div>`).join('');
  for(let i=0;i<28;i++){const d=addDays(start,i),k=dkey(d),dd=state.days[k];const fut=d>now&&k!==today();
    const cls=['d',isDone(k)?'done':'',st.frozen[k]?'frz':'',k===today()?'today':'',fut?'fut':''].join(' ');
    const lab=`${d.getMonth()+1}月${d.getDate()}日${isDone(k)?' ミッションクリア':st.frozen[k]?' お休み券':''}`;
    h+=`<div class="${cls}" aria-label="${lab}"><span>${d.getDate()}</span><span aria-hidden="true">${isDone(k)?'✓':st.frozen[k]?'❄︎':(dd&&dd.solved?'・':'')}</span></div>`;}
  h+=`</div><p class="muted" style="margin:8px 0 0">✓ ミッションクリア　❄︎ お休み券　・ 練習だけした日</p></section>`;
  app.innerHTML=h;
  $('bMission').onclick=()=>newSession('mission');
  $('bTA').onclick=()=>newSession('ta');
  $('bCards').onclick=()=>go('cards');
  app.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>newSession('world',Number(b.dataset.w)));
}
function renderCards(){
  const n=Object.keys(state.cards).length;
  let h=`<div class="topbar"><h1>🃏 技カード図鑑</h1><button class="btn" id="bBack">← ホームへ</button></div>
    <section class="card"><p style="margin:0 0 10px">集めたカード <b>${n} / ${CARDS.length}</b> 枚（技のカードは、まちがえずに解いた時に手に入る）</p><div class="cards">`;
  for(const c of CARDS){const on=!!state.cards[c.id];
    h+=`<div class="tcard ${on?'on':'off'}" aria-label="${esc(c.n)}${on?' 入手済み':' まだ'}"><div class="e" aria-hidden="true">${on?c.e:'❓'}</div><b>${on?esc(c.n):'？？？'}</b><span class="muted">${esc(c.d)}</span>${on?`<div class="muted">${esc(state.cards[c.id])}</div>`:''}</div>`;}
  h+=`</div></section>`;
  app.innerHTML=h;$('bBack').onclick=()=>go('home');
}
function renderPlay(shake){
  const p=ses.list[ses.idx],w=WORLDS[p.w-1],c=choiceOf(p),ta=ses.mode==='ta';
  const remain=()=>Math.max(0,Math.ceil((ses.endAt-Date.now())/1000));
  let h=`<div class="playhead"><button class="btn" id="bQuit">← やめる</button>`;
  h+=ta?`<div class="muted">解いた数 <b>${ses.results.length}</b>問</div><div class="timer ta" aria-live="off">⚡ のこり <span id="tm">${remain()}</span>秒</div></div>`
    :`<div class="prog" aria-label="${ses.list.length}問中${ses.idx+1}問め">${ses.list.map((q,i)=>`<i class="${i<ses.idx||(i===ses.idx&&cur.done)?'d':''} ${i===ses.idx?'c':''} ${q.boss?'boss':''}"></i>`).join('')}</div>
    <div class="timer" aria-hidden="true">⏱ <span id="tm">0</span>秒 / 目標${w.target}秒</div></div>`;
  h+=`<section class="card ${cur.done?'done-panel':(p.boss?'boss-panel':'')}"><div class="muted">${ta?'タイムアタック':ses.mode==='mission'?'今日のミッション':'練習'}　ワールド${w.id}　${esc(w.name)}</div>
    <p class="qtitle">${esc(qTitle(p))}</p>`;
  const dg=diagram(p,cur.ch,cur.done);if(dg)h+=`<div class="diagram">${dg}</div>`;
  if(cur.ch==null&&c){
    h+=`<div class="expr"><div class="ln">${esc(headOf(p))}</div></div><div class="choice"><p>${esc(c.prompt)}</p><div class="opts">`+
      c.labels.map((l,i)=>`<button class="opt" data-o="${i}" ${cur.wrongOpts.includes(i)?'disabled':''}>${esc(l)}</button>`).join('')+`</div></div>`;
  }else{
    const b=build(p,cur.ch);
    h+=`<div class="expr" aria-label="式">`+b.lines.map(ln=>`<div class="ln">`+ln.map(t=>{
      if(typeof t==='string')return `<span>${esc(t)}</span>`;
      const i=t.b,ok=cur.okb[i],act=!cur.done&&i===cur.active,ng=!ok&&!!cur.bad[i];
      return `<button class="blank ${ok?'ok':''} ${act?'act':''} ${ng?'ng':''} ${ng&&shake?'shake':''}" data-b="${i}" aria-label="空欄${i+1}${ok?' 正解':''}${act?' 入力中':''}" ${ok||cur.done?'aria-disabled="true"':''}>${esc(ok?b.ans[i]:(cur.vals[i]||'　'))}</button>`;
    }).join('')+`</div>`).join('')+`</div>`;
  }
  h+=`<div class="fb ${cur.fbc}" role="status" aria-live="polite">${esc(cur.fb)}</div>`;
  if(cur.done){
    const s=cur.stars,two=typ(p)==='split'?'工夫した分け方でノーミス':'ノーミス';
    h+=`<div class="stars pop" aria-label="★${s.stars}つ">${[1,2,3].map(i=>`<span class="${i<=s.stars?'on':'off'}">★</span>`).join('')}</div>
      <ul class="starlist"><li>★ 正解</li><li>${s.s2?'★':'☆'} ${two}${!s.best?'（もっと楽な分け方があるよ）':''}</li><li>${s.s3?'★':'☆'} 目標時間内（${s.sec}秒）</li>${p.boss?'<li>👑 ボス問題なので点が2倍！</li>':''}</ul>
      ${cur.newCards.map(id=>`<p class="newcard pop">🃏 新しい技カード「${esc(cardName(id))}」を手に入れた！</p>`).join('')}
      <p class="explain">${esc(explain(p,cur.ch,s.best))}</p>
      <button class="btn primary big" id="bNext">${ses.idx+1<ses.list.length?'つぎの問題へ ▶':'結果を見る ▶'}</button>`;
  }
  h+=`</section>`;
  if(!cur.done&&cur.ch!=null){
    h+=`<div class="keypad" role="group" aria-label="数字キー">`+['7','8','9','del','4','5','6','0','1','2','3','ok'].map(k=>{
      if(k==='del')return `<button class="key" data-k="del" aria-label="1文字消す">⌫</button>`;
      if(k==='ok')return `<button class="key go" data-k="ok">けってい</button>`;
      return `<button class="key" data-k="${k}">${k}</button>`;}).join('')+`</div>`;
  }
  app.innerHTML=h;
  $('bQuit').onclick=quit;
  app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>chooseOpt(Number(b.dataset.o)));
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>press(b.dataset.k));
  app.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.b);if(!cur.done&&!cur.okb[i]){cur.active=i;cur.fb='';cur.fbc='';render();}});
  const bn=$('bNext');if(bn){bn.onclick=next;bn.focus();}
  if(ta){const tick=()=>{if(Date.now()>=ses.endAt){clearInterval(timerId);timerId=null;endSession();return;}const e=$('tm');if(e)e.textContent=remain();};timerId=setInterval(tick,250);}
  else if(!cur.done){const tick=()=>{const e=$('tm');if(e)e.textContent=Math.floor((Date.now()-cur.start)/1000)};tick();timerId=setInterval(tick,1000);}
  else{const e=$('tm');if(e)e.textContent=cur.stars.sec;}
}
function renderResult(){
  let r=null;try{r=JSON.parse(lsGet(LAST)||'null')}catch(e){}
  if(!r||!num(r.n)||!num(r.stars)||!Array.isArray(r.worlds)){view='home';lsSet(VIEW,'home');renderHome();return;}
  const ta=r.mode==='ta'&&r.ta&&num(r.ta.n)?r.ta:null, rk=ta?rankOf():null;
  let h=`<div class="topbar"><h1>分配法則ラボ</h1></div><section class="card pop"><p class="res-big">${r.mode==='mission'?'🎉 ミッションクリア！':ta?`⚡ ${TA_SEC}秒で ${ta.n}問！`:'練習おわり！'}</p>`;
  if(ta)h+=`<p>${ta.newBest?'<b>🏅 自己ベスト更新！</b>　':''}自己ベスト ${num(ta.best)?ta.best:0}問${rk?`　ランク <b>${esc(rk.name)}</b>（直近の平均 ${rk.avg}秒）`:''}</p>`;
  h+=`<p>★ ${r.stars} / ${r.n*3}　（★3つは ${num(r.three)?r.three:0}問）</p><p>もらった点 <b>+${num(r.xp)?r.xp:0}</b>${r.bonus?`（ミッションボーナス ${r.bonus}点をふくむ）`:''}</p>`;
  if(r.lv1>r.lv0)h+=`<p class="res-big" style="color:var(--accent)">⬆ レベル${r.lv1}になった！ 「${esc(titleOf(r.lv1))}」</p>`;
  for(const id of (Array.isArray(r.cards)?r.cards:[])){const nm=cardName(id);if(nm)h+=`<p class="newcard">🃏 新しい技カード「${esc(nm)}」</p>`;}
  for(const x of r.worlds){const w=WORLDS[x.id-1];if(!w)continue;h+=`<p class="muted" style="margin:2px 0">ワールド${w.id} ${esc(w.name)}：習熟 ${x.p0} → <b>${x.p1}</b></p>`;}
  for(const id of (Array.isArray(r.newly)?r.newly:[])){const w=WORLDS[id-1];if(w)h+=`<p class="res-big" style="color:var(--accent)">🔓 ワールド${w.id}「${esc(w.name)}」が開いた！</p>`;}
  h+=`<div class="row" style="margin-top:12px"><button class="btn primary" id="bAgain">もう一度</button><button class="btn" id="bHome">ホームへ</button></div></section>`;
  app.innerHTML=h;
  $('bAgain').onclick=()=>newSession(r.mode,r.mode==='world'?(unlocked(r.w)?r.w:1):0);
  $('bHome').onclick=()=>go('home');$('bHome').focus();
}
document.addEventListener('keydown',e=>{
  if(view!=='play'||!cur||e.metaKey||e.ctrlKey||e.altKey)return;
  if(cur.done){const ae=document.activeElement;if(e.key==='Enter'&&!(ae&&ae.tagName==='BUTTON')){e.preventDefault();next();}return;}
  if(/^\d$/.test(e.key)){e.preventDefault();press(e.key);}
  else if(e.key==='Backspace'){e.preventDefault();press('del');}
  else if(e.key==='Enter'){if(document.activeElement&&document.activeElement.classList.contains('key'))return;e.preventDefault();press('ok');}
});
/* ===== 起動：直前の画面に戻す ===== */
(function boot(){
  const v=lsGet(VIEW);
  if(v==='play'){const s=loadSes();if(s){ses=s;
    if(s.mode==='ta'&&Date.now()>=s.endAt){cur=null;endSession();return;}
    cur=restoreCur(s);if(!cur)startProblem();view='play';render();return;}}
  if(v==='result'){view='result';render();return;}
  if(v==='cards'){view='cards';render();return;}
  view='home';render();
})();
</script>
</body>
</html>
