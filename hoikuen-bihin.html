<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>保育園 物品管理台帳</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%92%3C/text%3E%3C/svg%3E">
<meta name="description" content="保育園の備品・遊具・消耗品を写真つきで管理する台帳（複数の端末で共有）">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>
<style>
:root{
  --bg:#f7f6f2; --card:#ffffff; --ink:#24302e; --sub:#5d6b68; --line:#dde3e0;
  --pri:#2b8a6e; --pri-d:#1f6a54; --pri-l:#e3f4ee;
  --acc:#e8833a; --acc-l:#fdf0e5;
  --ng:#c92a2a; --ng-l:#fdecec; --warn:#b26a00; --warn-l:#fff4dc; --ok:#2b8a3e; --ok-l:#e8f6eb;
  --chip:#eef2f1; --sh:0 1px 3px rgba(0,0,0,.08); --r:12px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141917; --card:#1e2523; --ink:#e7eeeb; --sub:#a3b1ad; --line:#34403c;
    --pri:#4cc39f; --pri-d:#7dd8bb; --pri-l:#1d3a31;
    --acc:#f0a25f; --acc-l:#3a2a1b;
    --ng:#ff8a8a; --ng-l:#3d2020; --warn:#f2c35b; --warn-l:#3a3018; --ok:#7bd88f; --ok-l:#1d3324;
    --chip:#2a3330; --sh:0 1px 3px rgba(0,0,0,.4);
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif;font-size:16px;line-height:1.55;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
.hdr{background:var(--pri);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
@media (prefers-color-scheme: dark){.hdr{background:#1a4a3c}}
.hdr h1{font-size:1.1rem;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .org{font-size:.875rem;opacity:.85;display:block;font-weight:400}
.hdr button{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:10px;min-height:44px;padding:0 14px;cursor:pointer;font-weight:600}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:0;min-height:60px;cursor:pointer;color:var(--sub);font-size:.8125rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav.tabs button .ic{font-size:1.35rem;line-height:1}
nav.tabs button[aria-selected="true"]{color:var(--pri);font-weight:700}
@media (min-width:900px){
  body{padding-bottom:24px}
  nav.tabs{position:sticky;top:calc(68px + env(safe-area-inset-top));bottom:auto;border-top:0;border-bottom:1px solid var(--line);justify-content:center}
  nav.tabs button{flex:0 0 140px;flex-direction:row;font-size:.95rem;min-height:48px;gap:6px}
  nav.tabs button .ic{font-size:1.1rem}
}
main{max-width:1100px;margin:0 auto;padding:16px}
.view{display:none}.view.on{display:block}
h2{font-size:1.15rem;margin:8px 0 12px}
h3{font-size:1rem;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:12px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi .n{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.25}
[hidden]{display:none !important}
table.tb td.nw{white-space:nowrap}
table.tb td.nm{min-width:7em}
.kpi .l{font-size:.875rem;color:var(--sub)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
@media (prefers-color-scheme: dark){.btn.pri{color:#0d1f19}}
.btn.acc{background:var(--acc-l);border-color:var(--acc);color:var(--ink)}
.btn.ng{background:var(--ng-l);border-color:var(--ng);color:var(--ng)}
.btn.sm{min-height:44px;padding:0 12px;font-size:.9375rem}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.toolbar input[type=search]{flex:1 1 220px}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=email],input[type=password],input[type=url],select,textarea{min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;font-size:16px;width:100%}
textarea{min-height:80px;resize:vertical}
.toolbar select{width:auto;flex:0 1 auto;max-width:100%}
label.f{display:block;font-size:.9375rem;color:var(--sub);margin-bottom:10px}
label.f > span{display:block;margin-bottom:3px}
label.f .req{color:var(--ng)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 2px;margin:0 0 12px}
legend{font-weight:700;padding:0 6px;font-size:.95rem}
.hint{font-size:.8125rem;color:var(--sub);margin-top:2px}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--chip);font-size:.8125rem;white-space:nowrap}
.st-使用中{background:var(--ok-l);color:var(--ok)}
.st-保管中{background:var(--chip)}
.st-修理中{background:var(--warn-l);color:var(--warn)}
.st-貸出中{background:var(--acc-l);color:var(--acc)}
.st-紛失・所在不明{background:var(--ng-l);color:var(--ng)}
.st-廃棄済{background:var(--chip);color:var(--sub);text-decoration:line-through}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;margin-bottom:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;width:100%;text-align:left}
.alert.ng{background:var(--ng-l);border-color:var(--ng)}
.alert.warn{background:var(--warn-l);border-color:var(--warn)}
.alert .t{font-weight:700}
.muted{color:var(--sub)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
table.tb{width:100%;border-collapse:collapse;font-size:.9rem}
table.tb th,table.tb td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:left}
table.tb th{font-size:.8125rem;color:var(--sub);font-weight:600;white-space:nowrap}
table.tb tr.click{cursor:pointer}
table.tb tr.click:hover{background:var(--pri-l)}
.tbwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--chip);flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-size:1.3rem;color:var(--sub)}
.thumb.lg{width:64px;height:64px}
details.grp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;box-shadow:var(--sh)}
details.grp > summary{list-style:none;display:flex;gap:12px;align-items:center;padding:10px 12px;cursor:pointer;min-height:64px}
details.grp > summary::-webkit-details-marker{display:none}
details.grp > summary .nm{font-weight:700}
details.grp > summary .meta{font-size:.875rem;color:var(--sub)}
details.grp > summary .caret{margin-left:auto;transition:transform .15s;color:var(--sub)}
details.grp[open] > summary .caret{transform:rotate(90deg)}
.irow{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;min-height:56px}
.irow:hover{background:var(--pri-l)}
.irw{display:flex;border-top:1px solid var(--line)}
.irw > .irow{border-top:0;flex:1;min-width:0}
.man{min-width:56px;min-height:44px;border:0;border-left:1px solid var(--line);background:none;cursor:pointer;font-size:1.3rem;color:var(--ink)}
.man:hover{background:var(--pri-l)}
td .man{border:1px solid var(--line);border-radius:10px}
.irow .c1{flex:1;min-width:0}
.irow .c1 .a{font-weight:600}
.irow .c1 .b{font-size:.875rem;color:var(--sub);overflow:hidden;text-overflow:ellipsis}
.grpfoot{padding:8px 12px;border-top:1px solid var(--line)}
dialog{border:0;border-radius:16px;padding:0;width:min(760px,calc(100vw - 16px));max-height:calc(100vh - 24px);background:var(--card);color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.dh h2{margin:0;flex:1;font-size:1.05rem}
.db{padding:14px 16px}
.df{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card)}
.xbtn{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:1.1rem}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ph{position:relative;width:96px}
.ph img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;display:block;background:var(--chip)}
.ph .del{position:absolute;top:-6px;right:-6px;width:32px;height:32px;border-radius:50%;border:0;background:var(--ng);color:#fff;cursor:pointer;font-weight:700}
.ph select{font-size:13px;min-height:44px;padding:2px 4px;margin-top:4px}
.ph .cap{font-size:.8125rem;color:var(--sub);text-align:center;margin-top:2px}
.dl{display:grid;grid-template-columns:8.5em 1fr;gap:4px 12px;font-size:.92rem}
.dl dt{color:var(--sub)}
.dl dd{margin:0;word-break:break-word}
.tl{list-style:none;padding:0;margin:0}
.tl li{border-left:3px solid var(--pri);padding:4px 0 8px 12px;margin-left:4px;font-size:.9rem}
.tl li .d{font-size:.8125rem;color:var(--sub)}
.bar{height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--pri)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:100;font-size:.92rem;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--sub);padding:32px 12px}
.viewer img{max-width:100%;max-height:75vh;display:block;margin:0 auto}
.scanbox{position:relative;background:#000;border-radius:12px;overflow:hidden}
.scanbox video{width:100%;display:block;max-height:60vh;object-fit:cover}
.scanbox .frame{position:absolute;inset:20% 20%;border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);min-height:44px;padding:0 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pri);color:#fff;font-weight:700}
@media (prefers-color-scheme: dark){.seg button[aria-pressed="true"]{color:#0d1f19}}
.sel{width:24px;height:24px;accent-color:var(--pri)}
details.filters{margin-bottom:12px}
details.filters > summary{list-style:none}
details.filters > summary::-webkit-details-marker{display:none}
.pt td.code{white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#printArea{display:none}
.sync{min-width:44px;white-space:nowrap}
.sync .w{display:none}
@media (min-width:600px){.sync .w{display:inline}.sync .n{display:none}}
.sync.ng{background:var(--ng-l) !important;color:var(--ng) !important;border-color:var(--ng) !important}
.auth{max-width:460px;margin:24px auto;padding:0 16px}
body.auth-on main, body.auth-on nav.tabs, body.auth-on .hbtn{display:none !important}
body.auth-on{padding-bottom:24px}
.amsg{padding:10px 12px;border-radius:10px;margin-bottom:12px;border:1px solid var(--ng);background:var(--ng-l);color:var(--ink)}
.amsg.ok{border-color:var(--ok);background:var(--ok-l)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.6rem;letter-spacing:.08em;font-weight:700;padding:12px;border:2px dashed var(--pri);border-radius:12px;text-align:center;background:var(--pri-l);user-select:all;overflow-wrap:anywhere}
.mrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:8px 0}
.mrow .e{overflow-wrap:anywhere;min-width:0;flex:1 1 200px}
.mlist{list-style:none;margin:8px 0 0;padding:0}
.cprev{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);margin:12px 0 8px}
.cprev.ng{background:var(--ng-l);border-color:var(--ng)}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;color:#000;padding:0}
  body > *:not(#printArea){display:none !important}
  #printArea{display:block !important}
  .pt{width:100%;border-collapse:collapse;font-size:8.5pt}
  .pt th,.pt td{border:.5pt solid #555;padding:2pt 3pt;vertical-align:middle}
  .pt th{background:#eee}
  .pt img{width:14mm;height:14mm;object-fit:cover}
  .labels{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm}
  .lbl{border:.5pt dashed #888;padding:2mm;display:flex;gap:2mm;align-items:center;height:26mm;break-inside:avoid;overflow:hidden}
  .lbl svg,.lbl img{width:20mm;height:20mm;flex:0 0 auto}
  .lbl .t{font-size:8pt;line-height:1.25}
  .lbl .t b{font-size:10pt;display:block}
  .sheet{font-size:10pt}
  .sheet h1{font-size:15pt;margin:0 0 4mm}
  .sheet .phs img{width:55mm;height:55mm;object-fit:cover;margin:0 2mm 2mm 0;border:.5pt solid #999}
  .sheet table{border-collapse:collapse;width:100%}
  .sheet td,.sheet th{border:.5pt solid #777;padding:2pt 4pt;text-align:left}
  .pr-h{display:flex;justify-content:space-between;margin-bottom:3mm;font-size:10pt}
}
</style>
</head>
<body>
<header class="hdr">
  <h1>保育園 物品管理台帳<span class="org" id="orgName"></span></h1>
  <button type="button" id="syncChip" class="sync hbtn" aria-label="同期の状態を見る">…</button>
  <button type="button" id="btnScanTop" class="hbtn" aria-label="QRコードを読み取って備品を探す">QR</button>
  <button type="button" id="btnAddTop" class="hbtn">＋ 登録</button>
</header>
<section class="auth" id="auth" hidden aria-label="ログイン">
  <div class="card">
    <h2 id="authTitle" style="margin-top:0">ログイン</h2>
    <div id="authMsg" class="amsg" role="alert" hidden></div>
    <form id="authLogin" novalidate>
      <label class="f"><span>メールアドレス</span><input type="email" id="lgEmail" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false"></label>
      <label class="f"><span>パスワード</span><input type="password" id="lgPw" autocomplete="current-password"></label>
      <button type="submit" class="btn pri" id="lgBtn" style="width:100%">ログイン</button>
    </form>
    <form id="authCode" novalidate hidden>
      <p class="muted" style="margin-top:0">園の管理者から受け取ったコード（12文字）で、自分のパスワードを決めて始めます。パスワードを忘れた時の「再設定コード」もここに入れます。</p>
      <label class="f"><span>メールアドレス（コードを受け取った物）</span><input type="email" id="cdEmail" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false"></label>
      <label class="f"><span>コード</span><input type="text" id="cdCode" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" placeholder="例：ABCD-EFGH-JKLM"></label>
      <label class="f"><span>新しいパスワード（8文字以上）</span><input type="password" id="cdPw" autocomplete="new-password"></label>
      <label class="f"><span>新しいパスワード（確認のためもう一度）</span><input type="password" id="cdPw2" autocomplete="new-password"></label>
      <button type="submit" class="btn pri" id="cdBtn" style="width:100%">パスワードを決めて始める</button>
    </form>
    <div id="orgPick" hidden></div>
    <div class="row" style="margin-top:12px">
      <button type="button" class="btn" id="toCode">招待コード・再設定コードをお持ちの方</button>
      <button type="button" class="btn" id="toLogin" hidden>ログインに戻る</button>
      <button type="button" class="btn" id="authOut" hidden>ログアウト</button>
    </div>
    <p class="hint">パスワードを忘れた時は、園の管理者に「再設定コード」を出してもらい、上のボタンから入れてください。</p>
  </div>
</section>
<nav class="tabs" role="tablist" aria-label="画面の切り替え">
  <button role="tab" data-view="home" aria-selected="true"><span class="ic" aria-hidden="true">🏠</span>ホーム</button>
  <button role="tab" data-view="ledger" aria-selected="false"><span class="ic" aria-hidden="true">📒</span>台帳</button>
  <button role="tab" data-view="supplies" aria-selected="false"><span class="ic" aria-hidden="true">📦</span>消耗品</button>
  <button role="tab" data-view="stock" aria-selected="false"><span class="ic" aria-hidden="true">✅</span>棚卸</button>
  <button role="tab" data-view="settings" aria-selected="false"><span class="ic" aria-hidden="true">⚙️</span>設定</button>
</nav>
<main>
  <section class="view on" id="v-home" aria-label="ホーム"></section>
  <section class="view" id="v-ledger" aria-label="台帳">
    <div class="toolbar">
      <input type="search" id="q" placeholder="品名・型番・管理番号・メーカー・タグで検索" aria-label="検索">
    </div>
    <details class="filters" id="filters"><summary class="btn sm">絞り込み・並び替え <span id="fCount"></span></summary>
    <div class="toolbar" style="margin-top:8px">
      <select id="fCat" aria-label="分類で絞り込み"></select>
      <select id="fLoc" aria-label="保管場所で絞り込み"></select>
      <select id="fCls" aria-label="使用クラスで絞り込み"></select>
      <select id="fSt" aria-label="状態で絞り込み"></select>
      <select id="fFund" aria-label="財源で絞り込み"></select>
      <select id="fSort" aria-label="並び順">
        <option value="code">管理番号順</option><option value="name">品名順</option>
        <option value="dateDesc">購入日が新しい順</option><option value="dateAsc">購入日が古い順</option>
        <option value="priceDesc">金額が高い順</option><option value="loc">保管場所順</option>
      </select>
    </div></details>
    <div class="row" style="margin-bottom:12px;justify-content:space-between">
      <div class="seg" role="group" aria-label="表示の切り替え">
        <button type="button" data-mode="group" aria-pressed="true">品目ごと</button>
        <button type="button" data-mode="table" aria-pressed="false">一覧表</button>
      </div>
      <div class="row">
        <button type="button" class="btn sm acc" id="btnBulk" hidden>選んだ物をまとめて変更</button>
        <button type="button" class="btn sm" id="btnPrintLedger">🖨 台帳を印刷</button>
        <button type="button" class="btn sm" id="btnLabels">🏷 ラベル印刷</button>
        <button type="button" class="btn sm" id="btnCsv">⬇ CSV</button>
      </div>
    </div>
    <div class="muted" id="ledgerSum" style="font-size:.88rem;margin-bottom:8px"></div>
    <div id="ledgerBody"></div>
  </section>
  <section class="view" id="v-supplies" aria-label="消耗品"></section>
  <section class="view" id="v-stock" aria-label="棚卸"></section>
  <section class="view" id="v-settings" aria-label="設定"></section>
</main>

<dialog id="dlg" aria-modal="true"></dialog>
<dialog id="dlg2" aria-modal="true"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="printArea"></div>
<input type="file" id="fileImport" accept=".json,application/json" hidden>
<input type="file" id="fileCsv" accept=".csv,text/csv" hidden>

<script>
'use strict';
/* =========================================================
   保育園 物品管理台帳 — shared between devices

/* ---------- local cache (IndexedDB) ---------- */
const DATA_STORES = ['items','assets','logs','stocktakes','meta','photos'];
function openStores(name, ver, extra){
  return new Promise((res, rej) => {
    const r = indexedDB.open(name, ver);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('items')) d.createObjectStore('items', { keyPath:'id' });
      if (!d.objectStoreNames.contains('assets')) { const s = d.createObjectStore('assets', { keyPath:'id' }); s.createIndex('itemId', 'itemId'); }
      if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos', { keyPath:'id' });
      if (!d.objectStoreNames.contains('logs')) d.createObjectStore('logs', { keyPath:'id' });
      if (!d.objectStoreNames.contains('stocktakes')) d.createObjectStore('stocktakes', { keyPath:'id' });
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath:'key' });
      if (extra) { if (!d.objectStoreNames.contains('queue')) d.createObjectStore('queue', { keyPath:'seq', autoIncrement:true }); if (!d.objectStoreNames.contains('local')) d.createObjectStore('local', { keyPath:'k' }); }
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('ほかのタブがこの台帳を開いています。ほかのタブを閉じてから再読み込みしてください'));
  });
}
const cacheName = () => `hbsync_${ORG.id}_${ME.uid}`;
const rq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const getAll = s => rq(db.transaction(s).objectStore(s).getAll());
const getOne = (s, k) => rq(db.transaction(s).objectStore(s).get(k));
function idbTx(stores, fn){
  return new Promise((res, rej) => {
    const t = db.transaction(stores, 'readwrite'); let out;
    try { out = fn(t); } catch(e) { try { t.abort(); } catch(e2) {} rej(e); return; }
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('保存が中断されました'));
  });
}
const idbPut = (s, v) => idbTx([s], t => { t.objectStore(s).put(v); });
const getLocal = async k => { const r = await getOne('local', k); return r ? r.v : undefined; };
const setLocal = (k, v) => idbPut('local', { k, v });
// one writer at a time (local writes and applying downloaded rows never interleave)
let lockP = Promise.resolve();
function locked(fn){ const p = lockP.then(fn, fn); lockP = p.catch(() => {}); return p; }

/* ---------- merge rules (same as the server's hb_private.merge) ---------- */
const TABLE_OF = { items:'items', assets:'assets', logs:'logs', stocktakes:'stocktakes', meta:'settings', photos:'photos' };
const STORE_OF = Object.fromEntries(Object.entries(TABLE_OF).map(([s, t]) => [t, s]));
const DEEP_FIELDS = new Set(['checks', 'photoLabels', 'manuals', 'catPrefix']);
const ARRAY_FIELDS = new Set(['photoIds', 'categories', 'locations', 'classes', 'fundings']);
const LOCAL_FIELDS = { photos:new Set(['blob', 'thumb', 'uploaded']), meta:new Set(['key', 'lastBackup']) };
const isObj = v => v != null && typeof v === 'object' && !Array.isArray(v);
const stable = v => JSON.stringify(v, (k, x) => isObj(x) ? Object.keys(x).sort().reduce((o, kk) => (o[kk] = x[kk], o), {}) : x) ?? 'undefined';
function mergeJS(cur, set, inc, arr){
  const nd = { ...(cur || {}) };
  if (isObj(set)) for (const [k, v] of Object.entries(set)) {
    if (!(DEEP_FIELDS.has(k) && isObj(v))) { nd[k] = v; continue; }
    const o = { ...(isObj(nd[k]) ? nd[k] : {}) };
    for (const [kk, vv] of Object.entries(v)) o[kk] = (k === 'manuals' && isObj(vv) && isObj(o[kk])) ? { ...o[kk], ...vv } : vv;   // same rule as the server
    nd[k] = o;
  }
  if (isObj(inc)) for (const [k, v] of Object.entries(inc)) { if (typeof v !== 'number') continue; const b = typeof nd[k] === 'number' ? nd[k] : (/^-?\d+(\.\d+)?$/.test(String(nd[k] ?? '')) ? Number(nd[k]) : 0); nd[k] = b + v; }
  if (isObj(arr)) for (const [k, v] of Object.entries(arr)) {
    if (!isObj(v)) continue;
    const rem = Array.isArray(v.rem) ? v.rem : [], res = (Array.isArray(nd[k]) ? nd[k] : []).filter(e => !rem.includes(e));
    for (const e of (Array.isArray(v.add) ? v.add : [])) if (!res.includes(e)) res.push(e);
    if (Array.isArray(v.order)) { const pos = e => { const i = v.order.indexOf(e); return i < 0 ? v.order.length : i; }; nd[k] = res.map((e, i) => [e, pos(e), i]).sort((a, b) => a[1] - b[1] || a[2] - b[2]).map(x => x[0]); }
    else nd[k] = res;
  }
  return nd;
}
/* which fields did the user change? (base = what the screen showed, next = what is being saved) */
function diffRec(s, base, next, inc){
  const skip = LOCAL_FIELDS[s] || new Set(), set = {}, arr = {};
  for (const k of Object.keys(next)) {
    const b = next[k];
    if (k === 'id' || skip.has(k) || b === undefined || (inc && k in inc)) continue;
    if (!base) { set[k] = b; continue; }
    const a = base[k];
    if (stable(a) === stable(b)) continue;
    if (ARRAY_FIELDS.has(k) && Array.isArray(a) && Array.isArray(b)) {
      const add = b.filter(x => !a.includes(x)), rem = a.filter(x => !b.includes(x));
      arr[k] = { add, rem, order:b };   // items added on another device meanwhile are kept; this screen's order wins
      continue;
    }
    if (DEEP_FIELDS.has(k) && isObj(a) && isObj(b)) { const sub = {}; for (const kk of Object.keys(b)) if (stable(a[kk]) !== stable(b[kk])) sub[kk] = b[kk]; if (Object.keys(sub).length) set[k] = sub; continue; }
    set[k] = b;
  }
  return { set, arr };
}

/* write several records atomically: ops = [[store, 'put'|'delete', value|key, {base, inc}?], ...]
   Locally the change is applied at once (in one transaction together with its outbox entry);
   the server only receives the fields that changed, so edits made on another device are kept. */
function writeOps(ops){ return locked(() => writeOpsInner(ops)).then(r => { scheduleSync(); return r; }); }
async function writeOpsInner(ops){
  if (!db || !ORG) throw new Error('ログインしていません');
  const sops = [], uploads = [], local = [], seen = new Map();
  for (const [s, kind, v, x] of ops) {
    if (!TABLE_OF[s]) throw new Error('保存先が正しくありません：' + s);
    const key = kind === 'delete' ? v : (v && (s === 'meta' ? v.key : v.id));
    if (typeof key !== 'string' || !key || key.length > 64) throw new Error('保存するデータの形が正しくありません');
    const mk = s + '|' + key;
    const prev = seen.has(mk) ? seen.get(mk) : ((await getOne(s, key)) || null);
    if (kind === 'delete') { sops.push({ t:TABLE_OF[s], id:key, k:'delete' }); local.push([s, 'delete', key]); seen.set(mk, null); continue; }
    if (!isObj(v)) throw new Error('保存するデータの形が正しくありません');
    const inc = x && isObj(x.inc) ? x.inc : null;
    if (x && x.create && prev) continue;   // already here: a migration / restore never changes existing records
    const rec0 = { ...v };
    if (s === 'photos' && !prev) { rec0.path = `${ORG.id}/${key}`; if (v.thumb) rec0.thumbPath = `${ORG.id}/${key}_t`; }
    const { set, arr } = diffRec(s, prev ? ((x && x.base) || prev) : null, rec0, inc);
    if (prev && !Object.keys(set).length && !Object.keys(arr).length && !inc) continue;   // nothing changed
    const op = { t:TABLE_OF[s], id:key };
    if (x && x.create) op.k = 'create';   // the server adds it only if the id never existed (a deleted record stays deleted)
    if (Object.keys(set).length || !prev) op.set = set;
    if (Object.keys(arr).length) op.arr = arr;
    if (inc) op.inc = inc;
    sops.push(op);
    const rec = mergeJS(prev, op.set, op.inc, op.arr);
    if (s === 'meta') rec.key = key; else rec.id = key;
    if (s === 'photos') {
      if (v.blob) { rec.blob = v.blob; rec.thumb = v.thumb || null; }
      if (v.blob && !(prev && prev.uploaded)) { rec.uploaded = false; uploads.push(key); }
    }
    local.push([s, 'put', rec]); seen.set(mk, rec);
  }
  if (!sops.length) return;
  const entry = { batch:uid() + uid(), ops:sops, uploads, at:new Date().toISOString() };
  await idbTx([...new Set(local.map(l => l[0])), 'queue'], t => {
    for (const [s, k, v] of local) k === 'delete' ? t.objectStore(s).delete(v) : t.objectStore(s).put(v);
    t.objectStore('queue').add(entry);
  });
}

/* reading never writes (multi-device-sync 原則9) */
async function loadAll(){
  const [items, assets, logs, stocktakes, meta] = await Promise.all(['items','assets','logs','stocktakes','meta'].map(getAll));
  S.items = items; S.assets = assets; S.logs = logs; S.stocktakes = stocktakes;
  const m = meta.find(x => x.key === 'masters'), st = meta.find(x => x.key === 'settings');
  const list = (v, d) => Array.isArray(v) ? v.filter(x => typeof x === 'string') : [...d];
  S.masters = m ? { categories:list(m.categories, DEFAULT_MASTERS.categories), locations:list(m.locations, DEFAULT_MASTERS.locations), classes:list(m.classes, DEFAULT_MASTERS.classes), fundings:list(m.fundings, DEFAULT_MASTERS.fundings) } : JSON.parse(JSON.stringify(DEFAULT_MASTERS));
  S.settings = { ...DEFAULT_SETTINGS, ...(st || {}) }; delete S.settings.key;
  S.settings.lastBackup = (await getLocal('lastBackup')) || '';
}

/* ---------- server sync ---------- */
let ME = null, ORG = null, ORGS = [], AUTH = null;
const LS_ORG = 'hbk_org', LS_LEGACY = 'hbk_legacy', LS_AUTH = 'hbk-auth';
// one POST per call; text/plain keeps it a "simple" request (the GAS web app cannot answer CORS preflights)
async function api(action, body = {}){
  const r = await fetchT(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify({ ...body, action, token:AUTH ? AUTH.token : undefined }) }, /^(photo|fetchPdf)/.test(action) ? 180000 : 45000);
  if (!r.ok) { const e = new Error('サーバーが応答しませんでした（' + r.status + '）'); e.code = 'http'; throw e; }
  let j; try { j = await r.json(); } catch(err) { const e = new Error('サーバーの応答を読めませんでした（準備中の可能性があります）'); e.code = 'bad_response'; throw e; }
  if (!isObj(j)) { const e = new Error('サーバーの応答の形が正しくありません'); e.code = 'bad_response'; throw e; }
  if (!j.ok) { const e = new Error(typeof j.message === 'string' ? j.message : '失敗しました'); e.code = String(j.error || 'server'); throw e; }
  return j;
}
const blobToB64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).replace(/^data:[^,]*,/, '')); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
function b64ToBlob(b64, type){ const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type:type || '' }); }
const SYNC = { pending:0, parked:0, oldest:'', busy:false, online:true, lastOk:'', err:'', ready:false, proto:0 };
// errors the server will give every time for the same change: such a change is set aside (kept, exportable), not retried forever
const PERMANENT = ['bad_input', 'too_large'];
const isNetErr = e => !navigator.onLine || /fetch|network|load failed|timeout|abort/i.test(String((e && (e.message || e.name)) || e));

function syncError(e){
  if (isNetErr(e)) { SYNC.online = false; return; }
  const m = String((e && (e.message || e.code)) || e), c = e && e.code;
  if (c === 'auth') SYNC.err = 'ログインの期限が切れました。ログインし直してください（送れていない変更は端末に残っています）';
  else if (c === 'forbidden') SYNC.err = /期限/.test(m) ? m : 'この園に書き込む権限がありません。園の管理者に確かめてください';
  else SYNC.err = '送信できませんでした：' + m;
}
async function uploadPhoto(pid){
  const rec = await getOne('photos', pid);
  if (!rec || rec.uploaded || !rec.blob) return;
  const type = rec.blob.type || (rec.kind === 'pdf' ? 'application/pdf' : 'image/jpeg');
  await api('photoPut', { org:ORG.id, id:pid, which:'main', mime:type, b64:await blobToB64(rec.blob) });
  if (rec.thumb) await api('photoPut', { org:ORG.id, id:pid, which:'thumb', mime:rec.thumb.type || 'image/jpeg', b64:await blobToB64(rec.thumb) });
  await locked(async () => { const cur = await getOne('photos', pid); if (cur) await idbPut('photos', { ...cur, uploaded:true }); });
}
async function flush(){
  if (SYNC.proto < 1) return false;
  for (;;) {
    const e = (await getAll('queue')).find(x => !x.failed);
    if (!e) return true;
    try {
      for (const pid of (e.uploads || [])) await uploadPhoto(pid);
      const n = Math.ceil(e.ops.length / 400) || 1;
      for (let i = e.done || 0; i < n; i++) {
        const part = e.ops.slice(i * 400, (i + 1) * 400);
        await api('apply', { org:ORG.id, batch:n > 1 ? e.batch + ':' + i : e.batch, ops:part });
        if (n > 1) { e.done = i + 1; await idbPut('queue', e); }
      }
      await idbTx(['queue'], t => t.objectStore('queue').delete(e.seq));
      SYNC.err = ''; SYNC.online = true;
    } catch(err) {
      if (err && PERMANENT.includes(err.code)) { e.failed = { code:err.code, message:String(err.message || ''), at:new Date().toISOString() }; await idbPut('queue', e); continue; }
      syncError(err); return false;
    }
  }
}
async function pull(full){
  // the server numbers every change (rev) and only shows rows of fully written batches, so "since" is exact
  const since = full ? 0 : (Number(await getLocal('cursor')) || 0);
  let j;
  try { j = await api('pull', { org:ORG.id, since }); } catch(err) { syncError(err); return false; }
  const rev = Number(j.rev);
  if (!isFinite(rev) || rev < 0) { syncError(new Error('サーバーの応答の形が正しくありません')); return false; }
  const changed = await locked(() => applyPulled(isObj(j.rows) ? j.rows : {}, full && since === 0, rev));
  SYNC.lastOk = new Date().toISOString(); SYNC.online = true; SYNC.ready = true;
  if (changed) { await loadAll(); softRender(); }
  return true;
}
/* apply downloaded rows to the cache; changes still waiting in the outbox are laid on top (受信データは検査する) */
async function applyPulled(got, full, rev){

  const left = {};

  let changed = false;
  await idbTx([...DATA_STORES, 'local'], t => {
    for (const tb of Object.values(TABLE_OF)) {
      const rows = Array.isArray(got[tb]) ? got[tb] : [];
      const s = STORE_OF[tb], os = t.objectStore(s);
      for (const row of rows) {
        if (!row || typeof row.id !== 'string' || !row.id || row.id.length > 64 || typeof row.rev !== 'number') continue;
        if (full) left[s].delete(row.id);
        const data = isObj(row.data) ? row.data : null;
        if (!data && !row.deleted) continue;
        const ops = pend.get(tb + '|' + row.id);
        const g = os.get(row.id);
        g.onsuccess = () => {
          const old = g.result;
          // deleted on the server and nothing of ours is waiting → remove; an edit of ours that is waiting will revive it
          if (row.deleted && (!ops || ops.every(o => o.k === 'delete'))) { if (old) { os.delete(row.id); changed = true; } return; }
          let rec = { ...(data || {}) };
          if (ops) for (const o of ops) rec = o.k === 'delete' ? null : mergeJS(rec || {}, o.set, o.inc, o.arr);
          if (!rec) return;   // deleted here, not yet sent
          delete rec.blob; delete rec.thumb; delete rec.uploaded;
          if (s === 'meta') rec.key = row.id; else rec.id = row.id;
          if (s === 'photos' && old) { if (old.blob) rec.blob = old.blob; if (old.thumb) rec.thumb = old.thumb; if (old.uploaded != null) rec.uploaded = old.uploaded; }
          const strip = o => { const c = { ...o }; delete c.blob; delete c.thumb; delete c.uploaded; return stable(c); };
          if (!old || strip(old) !== strip(rec)) { os.put(rec); changed = true; }
        };
      }
    }
    if (full) for (const s of DATA_STORES) for (const k of left[s]) if (!pend.has(TABLE_OF[s] + '|' + k)) { t.objectStore(s).delete(k); changed = true; }
    t.objectStore('local').put({ k:'cursor', v:rev });
  });
  return changed;
}
let syncRun = null, syncAgain = false, syncFull = false, syncTimer = 0;
function sync(full){
  if (full) syncFull = true;
  if (syncRun) { syncAgain = true; return syncRun; }
  const p = (async () => {
    await null;   // syncRun is assigned before any of this runs (an offline run used to finish first and stay "running")
    SYNC.busy = true; updateSyncUI();
    try {
      do { syncAgain = false; const f = syncFull; syncFull = false;
        if (!navigator.onLine) { SYNC.online = false; break; }
        await flush(); if (!SYNC.online) break; await pull(f);
      } while (syncAgain);
    } finally { SYNC.busy = false; }
  })();

const itemOf = a => S.items.find(i => i.id === a.itemId) || { name:'（品目なし）', category:'' };

function bookValue(a){
  if (!isActive(a)) return 0;
  const p = totalPrice(a); if (!p) return null;
  if (!a.usefulLife || !a.purchaseDate) return null;
  const yrs = (new Date() - new Date(a.purchaseDate + 'T00:00:00')) / (365.25 * 864e5);
  return Math.max(0, Math.round(p * (1 - yrs / Number(a.usefulLife))));
}

/* 管理番号のルール: 頭文字（分類ごとに別の頭文字も可）＋桁数そろえの連番。
   使われている番号は数字で比べて飛ばす（桁数を変えても B-0001 と B-00001 が重ならない）。既存の番号は変えない。 */
const CODE_DIGITS = [3, 4, 5, 6];
function codeRule(cat, st = S.settings){
  const base = String(st.codePrefix ?? ''), cp = isObj(st.catPrefix) ? st.catPrefix : {};
  const own = (cat && typeof cp[cat] === 'string') ? cp[cat] : '';
  const d = Number(st.codeDigits);
  return { prefix: own || base, own: !!own && own.toUpperCase() !== base.toUpperCase(), digits: CODE_DIGITS.includes(d) ? d : 4 };
}
function usedNums(prefix, reserved){
  const P = String(prefix).toUpperCase(), set = new Set();
  const add = c => { c = String(c ?? '').toUpperCase(); if (!c.startsWith(P)) return; const t = c.slice(P.length); if (/^\d{1,9}$/.test(t)) set.add(Number(t)); };
  S.assets.forEach(a => add(a.code)); if (reserved) reserved.forEach(add);
  return set;
}
function nextCode(reserved, cat, st = S.settings){
  const r = codeRule(cat, st), used = usedNums(r.prefix, reserved);
  // the shared prefix continues from 「次の番号」(seq); a category's own prefix starts at 1. Numbers already used are skipped.
  let n = r.own ? 1 : Math.max(1, Math.floor(Number(st.seq)) || 1);
  while (used.has(n)) n++;
  if (!r.own) st.seq = n + 1;
  return r.prefix + String(n).padStart(r.digits, '0');
}
const findByCode = c => { c = half(c).toUpperCase(); return S.assets.find(a => String(a.code).toUpperCase() === c); };
function peekCode(cat, st = S.settings){ return nextCode(null, cat, { ...st }); }

const urlCache = new Map();
async function photoUrl(id, big){
  const k = id + (big ? ':b' : ':t');
  if (urlCache.has(k)) return urlCache.get(k);
  const p = await getOne('photos', id); if (!p) return '';
  let b = big ? p.blob : (p.thumb || p.blob);
  if (!b) b = await fetchPhoto(p, big || !p.thumbPath);
  if (!b) return '';
  const u = URL.createObjectURL(b); urlCache.set(k, u); return u;
}
/* download a photo the cache does not have yet (from the 園's private Drive folder, after the login check), keep it for offline use */
async function fetchPhoto(p, main){
  if (!AUTH || !ORG || !navigator.onLine) return null;
  try {
    const j = await api('photoGet', { org:ORG.id, id:p.id, which:main ? 'main' : 'thumb' });
    if (typeof j.b64 !== 'string' || !j.b64) return null;
    const blob = b64ToBlob(j.b64, typeof j.mime === 'string' ? j.mime : '');
    await locked(async () => { const cur = await getOne('photos', p.id); if (cur) await idbPut('photos', { ...cur, [main ? 'blob' : 'thumb']:blob, uploaded:true }); });
    return blob;
  } catch(e) { return null; }
}
async function hydrate(root = document){
  for (const img of $$('img[data-ph]', root)) {
    const rec = await getOne('photos', img.dataset.ph);
    if (rec && rec.kind === 'pdf') { const sp = Object.assign(document.createElement('span'), { className:img.className.includes('thumb') ? img.className : 'thumb lg', textContent:'📄', title:rec.name || 'PDF' }); sp.setAttribute('role', 'img'); sp.setAttribute('aria-label', 'PDF ' + (rec.name || '')); if (img.dataset.view) { sp.style.cursor = 'pointer'; sp.dataset.view = img.dataset.view; sp.style.width = sp.style.height = '96px'; sp.style.fontSize = '2.5rem'; } img.replaceWith(sp); continue; }
    const u = await photoUrl(img.dataset.ph, img.dataset.big === '1');

}
function loadImage(file){
  return new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => { res(im); URL.revokeObjectURL(u); }; im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('画像を読み込めませんでした')); }; im.src = u; });
}

  const s = Math.min(1, max / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
  const c = document.createElement('canvas'); c.width = Math.round((img.naturalWidth || img.width) * s); c.height = Math.round((img.naturalHeight || img.height) * s);

async function makePhoto(file){

    if (a.status === '修理中') A.push({ lv:'warn', t:'修理中', m:nm, id:a.id });

  const lb = S.settings.lastBackup;

  return A;
}

async function saveAssetForm(editing){
  const name = $('#fItem').value.trim();
  if (!name) { toast('品目名を入れてください'); $('#fItem').focus(); return; }
  const price = numOrNull($('#fPrice').value);
  if ($('#fPrice').value.trim() && price == null) { toast('購入金額は数字で入れてください'); $('#fPrice').focus(); return; }
  const qty = Math.max(1, parseInt(half($('#fQty').value), 10) || 1);
  const copies = editing ? 1 : Math.min(200, Math.max(1, parseInt($('#fCopies').value, 10) || 1));
  // pick up numbers another device has just used, so new management numbers do not collide
  if (!editing && navigator.onLine) { $('#afSave').disabled = true; try { await syncNow(3000); } finally { const b = $('#afSave'); if (b) b.disabled = false; } }
  let code = half($('#fCode').value);
  const dupA = code ? findByCode(code) : null;
  if (dupA && (!editing || dupA.id !== editing.id)) { toast('その管理番号はすでに使われています'); $('#fCode').focus(); return; }
  if (copies > 1 && code) { if (!confirm(`${copies}件まとめて登録する時は、管理番号を自動の連番で振ります。入力した「${code}」は1件目に使います。よろしいですか？`)) return; }
  const ops = [], now = new Date().toISOString();
  // item (品目)
  const cat = $('#fCatF').value;
  let item = S.items.find(i => i.name === name && i.kind !== 'consumable');
  if (editing && !item) { // renamed to a new name → new item
    item = null;
  }
  if (!item) { item = { id:uid(), name, category:cat, kind:'equipment', createdAt:now, updatedAt:now }; ops.push(['items','put',item]); }
  else if (cat && item.category !== cat) { const b0 = item; item = { ...item, category:cat, updatedAt:now }; ops.push(['items','put',item,{ base:b0 }]); }
  // photos
  const photoIds = formPhotos.map(p => p.id), photoLabels = {};
  formPhotos.forEach(p => { photoLabels[p.id] = p.label || ''; if (p.isNew) ops.push(['photos','put',{ ...p.rec, label:p.label }]); });
  if (editing) for (const pid of (editing.photoIds || [])) if (!photoIds.includes(pid) && photoRefCount(pid, editing.id) === 0) ops.push(['photos','delete',pid]);
  const f = {
    itemId:item.id, model:$('#fModel').value.trim(), maker:$('#fMaker').value.trim(), serial:$('#fSerial').value.trim(), qty,
    tags:$('#fTags').value.trim(), purchaseDate:$('#fPDate').value, price, vendor:$('#fVendor').value.trim(), funding:$('#fFundF').value,
    subsidyName:$('#fSubsidy').value.trim(), restrictUntil:$('#fRestrict').value, warrantyUntil:$('#fWarranty').value, leaseUntil:$('#fLease').value, accessories:$('#fAcc').value.trim(),
    usefulLife:numOrNull($('#fLife').value), location:$('#fLocF').value, className:$('#fClsF').value, status:$('#fStF').value,
    condition:$('#fCond').value, inspectCycle:numOrNull($('#fCycle').value), nextInspection:$('#fNext').value, note:$('#fNote').value,
    photoIds, photoLabels, updatedAt:now
  };
  const created = [];
  if (editing) {
    const upd = { ...editing, ...f, code: code || editing.code };
    if (editing.status === '廃棄済' && upd.status !== '廃棄済') Object.assign(upd, { disposalDate:'', disposalReason:'', disposalMethod:'', disposalApprover:'' });
    if (editing.status === '貸出中' && upd.status !== '貸出中') upd.loan = null;
    const changed = diffFields(editing, upd);
    ops.push(['assets','put',upd,{ base:editing }]);
    if (changed.length) ops.push(['logs','put',newLog({ assetId:upd.id, type:'編集', detail:'変更：' + changed.join('、') })]);
    if (editing.location !== upd.location && upd.location) ops.push(['logs','put',newLog({ assetId:upd.id, type:'移動', detail:`${editing.location || '未設定'} → ${upd.location}` })]);
    created.push(upd);
  } else {
    const seqBefore = S.settings.seq;
    for (let n = 0; n < copies; n++) {
      const c = (n === 0 && code) ? code : nextCode(new Set(created.map(x => x.code).concat(code ? [code] : [])), item.category);
      const a = { id:uid(), code:c, ...f, createdAt:now, loan:null };
      if (n > 0) a.serial = '';
      ops.push(['assets','put',a]);
      ops.push(['logs','put',newLog({ assetId:a.id, type:'登録', detail:`${name}を登録${a.price != null ? '（' + yen(a.price) + '）' : ''}` })]);
      created.push(a);
    }
    ops.push(['meta','put',{ key:'settings', ...S.settings }]);
    if (seqBefore === S.settings.seq && !code) { /* no-op */ }
  }
  try {
    await writeOps(ops);
  } catch(err) { await loadAll(); alert('保存できませんでした。データは変更されていません。\n' + err.message); return; }
  await loadAll();
  closeDlg();
  toast(editing ? '保存しました' : `${created.length}件登録しました`);
  render();
  if (created.length === 1) openAsset(created[0].id);
}
const FIELD_NAMES = { itemId:'品目', code:'管理番号', model:'型番', maker:'メーカー', serial:'製造番号', qty:'数量', tags:'タグ', purchaseDate:'購入日', price:'購入金額', vendor:'購入先', funding:'財源', subsidyName:'補助金名', restrictUntil:'処分制限期限', warrantyUntil:'保証期限', leaseUntil:'リース・契約期限', accessories:'付属品', usefulLife:'耐用年数', location:'保管場所', className:'使用クラス', status:'状態', condition:'傷み具合', inspectCycle:'点検周期', nextInspection:'次回点検日', note:'メモ', photoIds:'写真' };
function diffFields(a, b){ return Object.keys(FIELD_NAMES).filter(k => JSON.stringify(a[k] ?? '') !== JSON.stringify(b[k] ?? '')).map(k => FIELD_NAMES[k]); }

async function deleteAsset(assetId){

  const ops = [['assets','delete',a.id]];
  S.logs.filter(l => l.assetId === a.id).forEach(l => ops.push(['logs','delete',l.id]));
  (a.photoIds || []).forEach(p => { if (photoRefCount(p, a.id) === 0) ops.push(['photos','delete',p]); });

let scanStream = null, scanRAF = 0;
async function loadJsQR(){

}
async function openScanner(onCode, keepOpen){

    <div class="db"><div class="scanbox"><video id="scanV" playsinline muted aria-label="QR読み取り用のカメラ映像（音声なし）"><track kind="captions" label="音声なし"></video><div class="frame" aria-hidden="true"></div></div>
    <p class="muted" id="scanMsg">備品に貼ったラベルのQRコードを枠に合わせてください。</p>
    <div class="row"><input type="text" id="scanCode" placeholder="読めない時は管理番号を入力" style="flex:1;width:auto" autocomplete="off" aria-label="管理番号"><button type="button" class="btn" id="scanGo">開く</button></div></div>`);

  $('#scanGo').onclick = () => go($('#scanCode').value);

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $('#scanMsg').textContent = 'この端末ではカメラを使えません。管理番号を入力してください。'; return; }

  } catch(e) { $('#scanMsg').textContent = 'カメラを使えませんでした（ブラウザでカメラの使用を許可してください）。管理番号の入力でも探せます。'; return; }

  let detector = null;
  if ('BarcodeDetector' in window) { try { detector = new BarcodeDetector({ formats:['qr_code'] }); } catch(e) {} }
  if (!detector && !(await loadJsQR())) { $('#scanMsg').textContent = '読み取りの部品を読み込めませんでした（通信を確認）。管理番号を入力してください。'; return; }

    }

  };

}
function stopScan(){ cancelAnimationFrame(scanRAF); if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; } }

const CSV_COLS = [['管理番号','code'],['品目','_item'],['分類','_cat'],['型番','model'],['メーカー','maker'],['製造番号','serial'],['数量','qty'],['購入日','purchaseDate'],['購入先','vendor'],['購入金額(税込・単価)','price'],['財源','funding'],['補助金名','subsidyName'],['処分制限期限','restrictUntil'],['保証期限','warrantyUntil'],['リース・契約期限','leaseUntil'],['付属品','accessories'],['耐用年数','usefulLife'],['保管場所','location'],['使用クラス','className'],['状態','status'],['傷み具合','condition'],['点検周期(月)','inspectCycle'],['次回点検日','nextInspection'],['タグ','tags'],['廃棄日','disposalDate'],['廃棄理由','disposalReason'],['廃棄方法','disposalMethod'],['メモ','note']];
const csvCell = v => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function download(name, blob){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 60000); }
function exportCsv(list){
  const lines = [CSV_COLS.map(c => c[0]).join(',')];
  for (const a of list) { const it = itemOf(a); lines.push(CSV_COLS.map(([, k]) => csvCell(k === '_item' ? it.name : k === '_cat' ? it.category : a[k])).join(',')); }
  download(`備品台帳_${today()}.csv`, new Blob(['﻿' + lines.join('\r\n')], { type:'text/csv' }));
}
function parseCsv(text){
  const rows = []; let row = [], cell = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }

}
function normDate(s){
  s = half(s || '').replace(/[／]/g, '/').replace(/\s/g, ''); if (!s) return '';
  let m = s.match(/^(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/);
  if (m) return `${m[1]}-${z2(m[2])}-${z2(m[3])}`;
  m = s.match(/^(令和|平成|昭和|R|H|S)(\d{1,2}|元)[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/i);
  if (m) { const base = { '令和':2018, R:2018, r:2018, '平成':1988, H:1988, h:1988, '昭和':1925, S:1925, s:1925 }[m[1]]; const y = base + (m[2] === '元' ? 1 : Number(m[2])); return `${y}-${z2(m[3])}-${z2(m[4])}`; }

}
async function importCsv(file){

  const idx = {}; CSV_COLS.forEach(([h, k]) => { const i = head.findIndex(x => x === h || x === h.replace(/\(.*\)/, '')); if (i >= 0) idx[k] = i; });
  if (idx._item == null) { alert('「品目」の列が見つかりません。CSV出力した形（1行目が見出し）で用意してください。'); return; }
  const now = new Date().toISOString(), ops = [], items = [...S.items];
  let nNew = 0, nUpd = 0, nSkip = 0; const dupRows = [];
  const codesInFile = new Set(), badDates = [];
  const reserved = new Set(rows.slice(1).map(r => idx.code != null ? half(r[idx.code] || '').toUpperCase() : '').filter(Boolean));
  let rowNo = 1;
  for (const r of rows.slice(1)) {
    rowNo++;
    const g = k => idx[k] != null ? (r[idx[k]] || '').trim() : undefined;
    const name = g('_item'); if (!name) { nSkip++; continue; }
    let item = items.find(i => i.name === name && i.kind !== 'consumable');
    if (!item) { item = { id:uid(), name, category:g('_cat') || '', kind:'equipment', createdAt:now, updatedAt:now }; items.push(item); ops.push(['items','put',item]); }
    const code = half(g('code') || '');
    if (code && codesInFile.has(code.toUpperCase())) { nSkip++; dupRows.push(rowNo); continue; }
    const ex = code ? findByCode(code) : null;
    const rec = ex ? { ...ex } : { id:uid(), createdAt:now, photoIds:[], photoLabels:{}, loan:null, status:'使用中' };
    rec.itemId = item.id;
    for (const [, k] of CSV_COLS) {

      if (['price','usefulLife','inspectCycle','qty'].includes(k)) rec[k] = numOrNull(v);
      else if (['purchaseDate','restrictUntil','warrantyUntil','leaseUntil','nextInspection','disposalDate'].includes(k)) { const d = normDate(v); if (d === null) badDates.push(`${rowNo}行目 ${v}`); else rec[k] = d; }
      else if (k === 'status') rec[k] = STATUSES.includes(v) ? v : (rec.status || '使用中');

    if (!rec.qty) rec.qty = 1;

    ex ? nUpd++ : nNew++;
  }
  if (!confirm(`新規 ${nNew}件・更新 ${nUpd}件${nSkip ? `・読み飛ばし ${nSkip}件` : ''} を取り込みます。${dupRows.length ? `\n管理番号が重複している行（${dupRows.slice(0, 10).join('・')}行目）は読み飛ばします。` : ''}${badDates.length ? `\n読めない日付（${badDates.slice(0, 5).join('、')}${badDates.length > 5 ? ' ほか' : ''}）はその欄を変えずに取り込みます。` : ''}よろしいですか？\n（管理番号が同じ行は上書き更新します）`)) { await loadAll(); return; }
  ops.push(['meta','put',{ key:'settings', ...S.settings }]);
  try { await writeOps(ops); } catch(e) { await loadAll(); alert('取り込めませんでした。データは変更されていません。\n' + e.message); render(); return; }
  await loadAll(); toast(`取り込みました（新規 ${nNew}件・更新 ${nUpd}件）`); render();
}

const blobToDataUrl = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
async function dataUrlToBlob(u){ return (await fetch(u)).blob(); }
async function exportBackup(){
  toast('バックアップを作っています…');
  const photos = await getAll('photos');
  // photos taken on other devices may not be in this device's cache yet
  let miss = 0;
  for (const p of photos) { if (!p.blob) p.blob = await fetchPhoto(p, true); if (!p.thumb && p.thumbPath) p.thumb = await fetchPhoto(p, false); if (!p.blob) miss++; }
  if (miss) { alert(`写真${miss}枚をサーバーから取り出せませんでした。通信できる所で、もう一度お試しください。`); return; }
  const ph = [];
  for (const p of photos) ph.push({ id:p.id, label:p.label, kind:p.kind || '', name:p.name || '', createdAt:p.createdAt, blob:await blobToDataUrl(p.blob), thumb:p.thumb ? await blobToDataUrl(p.thumb) : '' });
  const meta = (await getAll('meta')).map(m => { const c = { ...m }; delete c.lastBackup; return c; });
  const data = { app:'hoikuen-bihin', version:1, exportedAt:new Date().toISOString(), items:S.items, assets:S.assets, logs:S.logs, stocktakes:S.stocktakes, meta, photos:ph };
  download(`物品台帳バックアップ_${today()}.json`, new Blob([JSON.stringify(data)], { type:'application/json' }));
  S.settings.lastBackup = new Date().toISOString(); await setLocal('lastBackup', S.settings.lastBackup); render();
}
/* add records the server does not have yet (backup restore / migration of the previous version's data).
   Existing records are never changed or removed, and the same file can be imported again without duplicates. */
async function planMerge(src){
  const have = k => new Set(S[k].map(x => x.id));
  const hi = have('items'), ha = have('assets'), hl = have('logs'), hs = have('stocktakes');
  const hp = new Set((await getAll('photos')).map(p => p.id));
  const add = { items:src.items.filter(x => !hi.has(x.id)), assets:src.assets.filter(x => !ha.has(x.id)), logs:(src.logs || []).filter(x => !hl.has(x.id)), stocktakes:(src.stocktakes || []).filter(x => !hs.has(x.id)), photos:(src.photos || []).filter(x => !hp.has(x.id)) };
  const codes = new Map(S.assets.map(a => [String(a.code).toUpperCase(), a.id]));
  const dup = add.assets.filter(a => a.code && codes.has(String(a.code).toUpperCase())).length;
  return { add, dup, same:src.assets.length - add.assets.length };
}
async function applyMerge(src, add, insertOnly){
  const ops = [];
  // migration of the previous version: a record deleted on purpose on the server stays deleted.
  // backup restore: bringing deleted records back is the point of a backup, so it may revive them.
  const C = insertOnly ? { create:true } : undefined;
  add.items.forEach(v => ops.push(['items','put',v,C])); add.assets.forEach(v => ops.push(['assets','put',v,C]));
  add.logs.forEach(v => ops.push(['logs','put',v,C])); add.stocktakes.forEach(v => ops.push(['stocktakes','put',v,C]));
  add.photos.forEach(v => ops.push(['photos','put',v,C]));
  const m = (src.meta || []).find(x => x && x.key === 'masters'), st = (src.meta || []).find(x => x && x.key === 'settings');
  if (m && canEditSettings()) {
    const nm = {}; let ch = false;
    for (const k of ['categories','locations','classes','fundings']) { const cur = S.masters[k] || []; const extra = (Array.isArray(m[k]) ? m[k] : []).filter(v => typeof v === 'string' && v && !cur.includes(v)); nm[k] = [...cur, ...extra]; if (extra.length) ch = true; }
    if (ch) ops.push(['meta','put',{ key:'masters', ...nm }, { base:{ key:'masters', ...S.masters } }]);
  }
  if (st) {
    const ns = { ...S.settings };
    if (!ns.orgName && typeof st.orgName === 'string' && canEditSettings()) ns.orgName = st.orgName;
    ns.seq = Math.max(Number(ns.seq) || 1, Number(st.seq) || 1);
    ops.push(['meta','put',{ key:'settings', ...ns }, { base:{ key:'settings', ...S.settings } }]);
  }
  await writeOps(ops);
  await loadAll();   // shown at once; photos upload in the background
  // full refresh afterwards: anything the server declined (deleted there) leaves this device's copy again
  if (insertOnly) await sync(true); else sync(true);
}
async function importBackup(file){
  let data;
  try { data = JSON.parse(await file.text()); } catch(e) { alert('バックアップのファイルを読めませんでした'); return; }
  if (data.app !== 'hoikuen-bihin' || !Array.isArray(data.assets) || !Array.isArray(data.items)) { alert('この台帳のバックアップではありません'); return; }
  const arr = k => data[k] == null ? [] : data[k];
  const badShape = ['items','assets','logs','stocktakes','meta','photos'].some(k => !Array.isArray(arr(k)))
    || ['items','assets','logs','stocktakes','photos'].some(k => arr(k).some(v => !v || typeof v !== 'object' || typeof v.id !== 'string' || !v.id))
    || arr('meta').some(v => !v || typeof v !== 'object' || typeof v.key !== 'string');
  if (badShape) { alert('バックアップの中身が壊れているため、復元を止めました。いまのデータはそのままです。'); return; }
  const D = /^\d{4}-\d{2}-\d{2}$/;
  data.assets = data.assets.map(a => { const o = { ...a }; ['qty','price','usefulLife','inspectCycle'].forEach(k => { if (o[k] != null && o[k] !== '') { const n = Number(o[k]); o[k] = isNaN(n) ? null : n; } }); ['purchaseDate','restrictUntil','warrantyUntil','leaseUntil','nextInspection','disposalDate'].forEach(k => { if (o[k] && !D.test(o[k])) o[k] = ''; }); if (!STATUSES.includes(o.status)) o.status = '使用中'; if (!Array.isArray(o.photoIds)) o.photoIds = []; o.code = String(o.code ?? ''); return o; });
  if (data.assets.length === 0 && data.items.length === 0 && (S.assets.length || S.items.length)) { alert('このバックアップは中身が空です。いまのデータを守るため、復元を止めました。\n（データを消したい時は「すべてのデータを消す」を使ってください）'); return; }
  await syncNow();
  const plan = await planMerge({ ...data, logs:arr('logs'), stocktakes:arr('stocktakes'), photos:arr('photos') });
  const n = plan.add.items.length + plan.add.assets.length + plan.add.logs.length + plan.add.stocktakes.length + plan.add.photos.length;
  if (!n) { alert('このバックアップの中身は、すべて台帳にあります。追加する物はありません。'); return; }
  if (!confirm(`バックアップ（${jdate(isoDay(data.exportedAt))}作成）から、台帳にまだ無い物を追加します。\n・備品 ${plan.add.assets.length}件／品目 ${plan.add.items.length}件／記録 ${plan.add.logs.length}件／写真 ${plan.add.photos.length}枚\n${plan.same ? `・すでにある備品${plan.same}件は変えません\n` : ''}${plan.dup ? `・管理番号がほかの備品と重なる物が${plan.dup}件あります（そのまま追加し、ホームに「重複」として出します）\n` : ''}台帳から削除した物も、バックアップにあれば元に戻ります。いまのデータは消えません。この園のすべての端末に反映されます。よろしいですか？`)) return;
  let photos;
  try { photos = await Promise.all(plan.add.photos.map(async p => ({ id:p.id, label:p.label, kind:p.kind || '', name:p.name || '', createdAt:p.createdAt, blob:await dataUrlToBlob(p.blob), thumb:p.thumb ? await dataUrlToBlob(p.thumb) : null }))); }
  catch(e) { alert('写真の読み込みに失敗しました。データは変更していません。'); return; }
  try { await applyMerge(data, { ...plan.add, photos }); }
  catch(e) { alert('復元できませんでした。データは元のままです。\n' + (e && e.message)); return; }
  urlCache.clear(); toast(`追加しました（備品${plan.add.assets.length}件）`); render();
}

    const next = peekCode('', st), stat = codeStats(r.prefix), want = f.seqChanged ? Number(f.seqIn) : null;
    const wantCode = want != null ? r.prefix + String(want).padStart(r.digits, '0') : '';
    lines.push(`見本：<b>${esc(r.prefix + '1'.padStart(r.digits, '0'))}</b>　次に振る番号：<b>${esc(next)}</b>`);
    if (want != null && wantCode !== next) lines.push(`⚠️ ${esc(wantCode)} はすでに使われているため、空いている ${esc(next)} から振ります。`);
    if (stat.n) {
      lines.push(`この頭文字の既存の番号：${stat.n}件（いちばん大きい数字 ${stat.max}）。使われている番号とは重ならないように飛ばします。`);
      const odd = Object.entries(stat.lens).filter(([l]) => Number(l) !== r.digits);
      if (odd.length) lines.push(`ℹ️ 桁数の違う既存の番号（${odd.map(([l, c]) => `${l}桁 ${c}件`).join('・')}）はそのまま残ります。数字が同じ番号は重ならないように飛ばします。`);
      if (want != null && want < stat.max) lines.push(`ℹ️ ${stat.max} より小さい数字を入れたため、途中の空いている番号から振ります。`);
    } else lines.push('この頭文字の既存の番号はまだありません。');
    if (next.length - r.prefix.length > r.digits) lines.push(`⚠️ 番号が${r.digits}桁を超えています。桁数を増やすことをおすすめします。`);
    $$('[data-cpn]', box).forEach(h => {
      const c = cats[Number(h.dataset.cpn)], own = st.catPrefix[c] || '';
      if (!own) { h.textContent = ''; return; }
      const shared = cats.filter(x => x !== c && (st.catPrefix[x] || '').toUpperCase() === own.toUpperCase());
      h.textContent = `次に振る番号：${peekCode(c, st)}` + (own.toUpperCase() === r.prefix.toUpperCase() ? '（共通の頭文字と同じなので、共通の番号の続きを使います）' : shared.length ? `（「${shared.join('」「')}」と同じ頭文字なので、番号を分け合います）` : '');
    });
    $('#codePrev').className = 'cprev'; $('#codePrev').innerHTML = lines.join('<br>');
    return f;
  };
  show();
  if (!ed) return;
  box.addEventListener('input', show); box.addEventListener('change', show);
  $('#sSaveCode').onclick = async () => {
    const f = show(); if (problems(f).length) { toast('入力を確かめてください'); return; }
    if (f.st.codePrefix !== base.codePrefix || f.st.codeDigits !== codeRule('', base).digits) {
      if (!confirm(`これから登録する備品の番号は「${peekCode('', f.st)}」のような形になります。\nすでに付いている番号は変わりません。保存しますか？`)) return;
    }
    await saveSettings(f.st, base); toast('番号のルールを保存しました（既存の番号は変えていません）'); renderCodeCard();
  };
}

/* 選択肢の一覧: 1件ずつ 追加・名前の変更・外す・並べ替え。変えるたびに保存する（足した物・外した物・並び順だけを送る） */
const MASTER_DEFS = [['categories','分類'],['locations','保管場所'],['classes','使用クラス・担当'],['fundings','財源']];
const LS_MKIND = 'hbk_mkind';
let mKind = (() => { try { const v = localStorage.getItem(LS_MKIND); return MASTER_DEFS.some(d => d[0] === v) ? v : 'categories'; } catch(e) { return 'categories'; } })();
// every record whose field holds the value (the same list is used for "change them too")
function masterRefs(kind, v){
  const out = [], add = (st, rec, f) => { if (rec[f] === v) out.push([st, rec, f]); };
  if (kind === 'categories') S.items.forEach(i => add('items', i, 'category'));
  if (kind === 'locations') { S.assets.forEach(a => add('assets', a, 'location')); S.items.forEach(i => add('items', i, 'location')); S.stocktakes.filter(t => !t.finishedAt).forEach(t => { add('stocktakes', t, 'location'); add('stocktakes', t, 'here'); }); }
  if (kind === 'classes') S.assets.forEach(a => add('assets', a, 'className'));
  if (kind === 'fundings') S.assets.forEach(a => add('assets', a, 'funding'));
  return out;
}
function masterUse(kind, v){
  let a = 0, c = 0;
  if (kind === 'categories') { const ids = new Set(S.items.filter(i => i.category === v && i.kind !== 'consumable').map(i => i.id)); a = S.assets.filter(x => ids.has(x.itemId)).length; c = S.items.filter(i => i.category === v && i.kind === 'consumable').length; }
  else if (kind === 'locations') { a = S.assets.filter(x => x.location === v).length; c = S.items.filter(i => i.kind === 'consumable' && i.location === v).length; }
  else a = S.assets.filter(x => x[kind === 'classes' ? 'className' : 'funding'] === v).length;
  return { a, c, n:a + c, text:(a || c) ? [a ? `備品 ${a}件` : '', c ? `消耗品 ${c}件` : ''].filter(Boolean).join('・') : '使われていません' };
}
function masterOrphans(kind){
  const vals = new Set();
  const fields = { categories:[['items','category']], locations:[['assets','location'],['items','location']], classes:[['assets','className']], fundings:[['assets','funding']] }[kind];
  for (const [st, f] of fields) for (const r of S[st]) { const v = r[f]; if (typeof v === 'string' && v && !S.masters[kind].includes(v)) vals.add(v); }
  return [...vals];
}
async function saveMasters(kind, mut, extra = []){

// rename one entry (inList) or put a value that is only on records to another name; optionally change the records too
function renameMaster(kind, v, inList){
  const label = MASTER_DEFS.find(d => d[0] === kind)[1], u = masterUse(kind, v), refs = masterRefs(kind, v);
  const stk = kind === 'locations' && refs.some(r => r[0] === 'stocktakes');

      ${refs.length ? `<label class="row" style="min-height:44px;cursor:pointer;flex-wrap:nowrap"><input type="checkbox" id="rnAll" style="width:24px;height:24px;flex:none"${inList ? '' : ' checked'}><span>登録済みの値（${esc(u.text)}${stk ? '・途中の棚卸' : ''}）も新しい名前に変える</span></label>
      <div class="hint">${inList ? `印を付けない時は、登録済みの備品は「${esc(v)}」のまま残ります。` : '登録済みの値を新しい名前に直します。'}</div>` : '<div class="hint">この名前を使っている備品はありません。</div>'}
      <div id="rnMsg" class="hint" role="alert" style="color:var(--ng)"></div>

    <div class="df"><button type="button" class="btn" data-close>やめる</button><button type="button" class="btn pri" id="rnSave">名前を変える</button></div>`, 'dlg2');

/* ---------- previous version's data on this device (IndexedDB 'hoikuen-bihin') ---------- */
let legacyState = null;
async function readLegacy(){
  try { if (indexedDB.databases) { const l = await indexedDB.databases(); if (!l.some(d => d.name === DB_NAME)) return null; } } catch(e) {}
  let ldb;
  try { ldb = await openStores(DB_NAME, DB_VER, false); } catch(e) { return null; }
  try {
    const all = s => rq(ldb.transaction(s).objectStore(s).getAll());
    const [items, assets, logs, stocktakes, meta, photos] = await Promise.all(['items','assets','logs','stocktakes','meta','photos'].map(all));
    const okId = v => v && typeof v === 'object' && typeof v.id === 'string' && v.id;
    return { items:items.filter(okId), assets:assets.filter(okId), logs:logs.filter(okId), stocktakes:stocktakes.filter(okId), meta:meta.filter(v => v && typeof v.key === 'string'), photos:photos.filter(okId) };
  } finally { ldb.close(); }
}
async function checkLegacy(){
  const L = await readLegacy();
  if (!L || (!L.assets.length && !L.items.length)) { legacyState = null; return; }
  let done = null; try { done = JSON.parse(localStorage.getItem(LS_LEGACY) || 'null'); } catch(e) {}
  legacyState = { n:L.assets.length, photos:L.photos.length, done:done && done.uid === ME.uid ? done : null };
}
async function migrateLegacy(){
  const L = await readLegacy();
  if (!L || (!L.assets.length && !L.items.length)) { toast('前の版のデータはありません'); return; }
  if (!navigator.onLine) { alert('通信できる所で行ってください。'); return; }
  await syncNow();
  const plan = await planMerge(L);
  const n = plan.add.items.length + plan.add.assets.length + plan.add.logs.length + plan.add.photos.length + plan.add.stocktakes.length;
  if (n) {
    if (!confirm(`この端末に前の版で保存した台帳（備品${L.assets.length}件・写真${L.photos.length}枚）を、「${S.settings.orgName || ORG.name}」のサーバーへ移します。\n・サーバーにまだ無い物だけを足します（備品${plan.add.assets.length}件・写真${plan.add.photos.length}枚・記録${plan.add.logs.length}件）\n${plan.same ? `・すでにある備品${plan.same}件は変えません\n` : ''}${plan.dup ? `・管理番号がほかの備品と重なる物が${plan.dup}件あります（そのまま移し、ホームに「重複」として出します）\n` : ''}・端末の元のデータは消しません\nよろしいですか？`)) return;
    await applyMerge(L, plan.add, true);
  }
  toast('サーバーへ送っています…');
  await sync(true);
  // done only when every record is seen on the server (原則6)
  let missing = 0;
  try {
    for (const [t, list] of [['items', L.items], ['assets', L.assets], ['logs', L.logs], ['photos', L.photos], ['stocktakes', L.stocktakes]]) {
      const ids = list.map(x => x.id);
      for (let i = 0; i < ids.length; i += 300) {
        const part = ids.slice(i, i + 300);
        const j = await api('has', { org:ORG.id, ids:{ [t]:part } });
        missing += part.length - ((j.has && Array.isArray(j.has[t])) ? j.has[t].length : 0);
      }
    }
  } catch(e) { missing = -1; }
  if (missing === 0 && !SYNC.pending) {
    try { localStorage.setItem(LS_LEGACY, JSON.stringify({ uid:ME.uid, org:ORG.id, at:new Date().toISOString(), n:L.assets.length })); } catch(e) {}
    toast('移行が終わりました（サーバーで確認済み）');
  } else alert('まだサーバーに届いていない分があります。通信できる所で、もう一度「サーバーへ移す」を押してください（二重にはなりません）。');
  await checkLegacy(); await loadAll(); renderDeferred = false; render();
}

/* ---------- sign-in ---------- */
function authMsg(text, good){ const m = $('#authMsg'); m.hidden = !text; m.textContent = text || ''; m.classList.toggle('ok', !!good); }
function showAuth(mode, msg){
  document.body.classList.add('auth-on'); $('#auth').hidden = false;
  const code = mode === 'code', pick = mode === 'pick';
  $('#authLogin').hidden = code || pick || mode === 'noorg'; $('#authCode').hidden = !code; $('#orgPick').hidden = !pick;
  $('#toCode').hidden = code || pick; $('#toLogin').hidden = !code; $('#authOut').hidden = !(pick || mode === 'noorg');
  $('#authTitle').textContent = code ? '招待コード・再設定コード' : pick ? '園を選ぶ' : mode === 'noorg' ? '園に所属していません' : 'ログイン';
  authMsg(msg || (mode === 'noorg' ? 'このアカウントは、まだどの園にも所属していません。園の管理者から招待コードを受け取り、「招待コード・再設定コードをお持ちの方」から入れてください。' : ''));
  const f = code ? $('#cdEmail') : $('#lgEmail'); if (f && !pick) setTimeout(() => f.focus(), 30);
}
function hideAuth(){ document.body.classList.remove('auth-on'); $('#auth').hidden = true; }
$('#toCode').onclick = () => showAuth('code');
$('#toLogin').onclick = () => showAuth('login');
// sign out on this device even without a connection (the server-side session is ended when it can be reached)
async function signOutLocal(){ try { await Promise.race([api('logout'), new Promise(r => setTimeout(r, 5000))]); } catch(e) {} AUTH = null; try { localStorage.removeItem(LS_AUTH); } catch(e) {} }
function saveAuth(j){ AUTH = { token:j.token, uid:j.user.uid, email:j.user.email }; try { localStorage.setItem(LS_AUTH, JSON.stringify(AUTH)); } catch(e) {} }
$('#authOut').onclick = async () => { await signOutLocal(); location.reload(); };
$('#authLogin').onsubmit = async e => {
  e.preventDefault();
  const email = $('#lgEmail').value.trim(), pw = $('#lgPw').value;
  if (!email || !pw) { authMsg('メールアドレスとパスワードを入れてください'); return; }
  $('#lgBtn').disabled = true; authMsg('');
  try {
    let j;
    try { j = await api('login', { email, password:pw }); }
    catch(error) { authMsg(isNetErr(error) ? '通信できませんでした。電波・Wi-Fiを確かめてください。' : error.code === 'login' ? 'メールアドレスかパスワードが違います。忘れた時は、園の管理者に再設定コードを出してもらってください。' : error.message); return; }
    $('#lgPw').value = '';
    saveAuth(j);
    await startSession(j.user, j.orgs);
  } finally { $('#lgBtn').disabled = false; }
};
$('#authCode').onsubmit = async e => {
  e.preventDefault();
  const email = $('#cdEmail').value.trim(), code = $('#cdCode').value.trim(), pw = $('#cdPw').value;
  if (!email || !code) { authMsg('メールアドレスとコードを入れてください'); return; }
  if (pw.length < 8) { authMsg('パスワードは8文字以上にしてください'); $('#cdPw').focus(); return; }
  if (pw !== $('#cdPw2').value) { authMsg('確認のパスワードが一致しません'); $('#cdPw2').focus(); return; }
  $('#cdBtn').disabled = true; authMsg('');
  try {
    try { await api('redeem', { email, code, password:pw }); }
    catch(err) { authMsg(isNetErr(err) ? '通信できませんでした。電波・Wi-Fiを確かめてください。' : err.message); return; }
    let j;
    try { j = await api('login', { email, password:pw }); }
    catch(err) { showAuth('login', 'パスワードを設定しました。ログインしてください。'); $('#authMsg').classList.add('ok'); return; }
    ['#cdPw','#cdPw2','#cdCode'].forEach(id => $(id).value = '');
    saveAuth(j);
    await startSession(j.user, j.orgs);
  } finally { $('#cdBtn').disabled = false; }
};
async function startSession(user, knownOrgs){
  ME = { uid:user.uid, email:user.email };
  let saved = null; try { saved = JSON.parse(localStorage.getItem(LS_ORG) || 'null'); } catch(e) {}
  if (saved && saved.uid !== ME.uid) saved = null;
  let orgs = Array.isArray(knownOrgs) ? knownOrgs : null;
  if (!orgs && navigator.onLine) {
    try { const j = await api('me'); if (Array.isArray(j.orgs)) orgs = j.orgs; }
    catch(e) { if (e.code === 'auth') { await signOutLocal(); showAuth('login', 'ログインの期限が切れました。もう一度ログインしてください。'); return; } }
  }
  if (orgs) {
    ORGS = orgs.filter(o => o && typeof o.org_id === 'string');
    if (!ORGS.length) { showAuth('noorg'); return; }
    const o = ORGS.find(x => saved && x.org_id === saved.id) || (ORGS.length === 1 ? ORGS[0] : null);
    if (!o) {
      showAuth('pick', 'この台帳を使う園を選んでください。');
      $('#orgPick').innerHTML = ORGS.map((x, i) => `<button type="button" class="btn" style="width:100%;margin-bottom:8px" data-pick="${i}">${esc(x.name)}（${esc(roleLabel(x.role))}）</button>`).join('');
      $$('[data-pick]').forEach(b => b.onclick = () => { const x = ORGS[Number(b.dataset.pick)]; try { localStorage.setItem(LS_ORG, JSON.stringify({ uid:ME.uid, id:x.org_id, role:x.role })); } catch(e) {} startSession(user, ORGS); });
      return;
    }
    ORG = { id:o.org_id, name:o.name, role:o.role };
  } else {
    // offline: open the 園 this person last used on this device (its cache)
    if (!saved) { showAuth('login', 'はじめて使う時は通信が必要です。通信できる所で開いてください。'); return; }
    ORG = { id:saved.id, name:'', role:saved.role };
  }
  try { localStorage.setItem(LS_ORG, JSON.stringify({ uid:ME.uid, id:ORG.id, role:ORG.role })); } catch(e) {}
  await openApp();
}
let pollTimer = 0;
async function openApp(){
  try { db = await openStores(cacheName(), 1, true); }
  catch(e) { hideAuth(); document.querySelector('main').innerHTML = `<div class="card" style="color:var(--ng)">データの保存場所を開けませんでした。プライベートブラウズを切るか、別のブラウザでお試しください。<br>${esc(e.message)}</div>`; return; }
  hideAuth();
  try { if (navigator.storage && navigator.storage.persist) persistState = (await navigator.storage.persisted()) || (await navigator.storage.persist()); } catch(e) {}
  SYNC.proto = 1;
  if (navigator.onLine) {
    // capability check (原則7): the sync protocol is used only once the server declares it
    try { const v = await api('version'); if (v.app !== 'hoikuen-bihin' || !(Number(v.proto) >= 1)) { SYNC.proto = 0; SYNC.err = 'サーバーの版が合いません。運営者に連絡してください（送れていない変更は端末に残っています）'; } } catch(e) {}
  }
  const first = (await getLocal('cursor')) === undefined;
  await loadAll();
  if (first) {
    $('#v-home').innerHTML = '<div class="card" role="status">サーバーから台帳を読み込んでいます…</div>';
    if (!(await pull(true))) {
      $('#v-home').innerHTML = `<div class="card" role="alert"><b>台帳を読み込めませんでした。</b><br>${esc(SYNC.err || '通信できる所で、もう一度開いてください。')}<br><br><button type="button" class="btn pri" onclick="location.reload()">もう一度読み込む</button></div>`;
      updateSyncUI(); return;
    }
    await loadAll();
  }
  await checkLegacy();
  let v = 'home', m = 'group';
  try { v = localStorage.getItem(LS_VIEW) || 'home'; m = localStorage.getItem(LS_MODE) || 'group'; } catch(e) {}
  ledgerMode = ['group','table'].includes(m) ? m : 'group';
  fillFilterSelects();
  if (window.matchMedia('(min-width: 900px)').matches) $('#filters').open = true;
  show(VIEWS.includes(v) ? v : 'home');
  window.__ready = true;
  if (!first) sync(true); else updateSyncUI();
  pollTimer = setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 15000);
}
window.addEventListener('online', () => { SYNC.online = true; if (ORG && db) sync(); });
window.addEventListener('offline', () => { SYNC.online = false; updateSyncUI(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && ORG && db) sync(); });

(async function init(){
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(API_URL) && !/^http:\/\/127\.0\.0\.1:\d+\/exec$/.test(API_URL)) {
    document.querySelector('main').innerHTML = '<div class="card" role="alert">サーバーの設定がありません。運営者に連絡してください。</div>'; return;
  }
  try { const a = JSON.parse(localStorage.getItem(LS_AUTH) || 'null'); if (a && typeof a.token === 'string' && typeof a.uid === 'string' && typeof a.email === 'string') AUTH = a; } catch(e) {}
  if (!AUTH) { showAuth('login'); return; }
  await startSession({ uid:AUTH.uid, email:AUTH.email });
})();
</script>
